<!doctype html>
<html lang="en" class="h-full bg-slate-50">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lifecare360 Doctor Portal</title>
    <link rel="icon" href="life.jpeg" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM 18 -->
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <!-- Babel Standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
        100% {
          transform: scale(0.95);
          opacity: 0.5;
        }
      }
      .pulse-logo {
        animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes slide-in {
        from {
          transform: translateY(1rem);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-in {
        animation: slide-in 0.3s ease-out forwards;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.4s ease-out forwards;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f0fdfa",
                100: "#ccfbf1",
                500: "#14b8a6",
                600: "#0d9488",
                700: "#0f766e",
                900: "#115e59",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="h-full text-slate-800">
    <div id="root" class="h-full"></div>

    <!-- Main script block executing JSX and ES Modules -->
    <script type="text/babel" data-type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        signOut,
        sendPasswordResetEmail,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getDatabase,
        ref,
        set,
        get,
        child,
        push,
        onValue,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

      const { useState, useEffect, useRef } = React;

      // --- Embedded Custom SVG Icons (Lucide replacements) ---
      const Icon = ({ name, className = "w-6 h-6", ...props }) => {
        const icons = {
          activity: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
          ),
          stethoscope: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.3.3 0 1 0 .2.3" />
              <path d="M8 15v1a6 6 0 0 0 6 6h2a6 6 0 0 0 6-6v-4" />
              <circle cx="20" cy="10" r="2" />
            </svg>
          ),
          eye: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          ),
          eyeOff: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <line x1="2" y1="2" x2="22" y2="22" />
            </svg>
          ),
          logout: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          ),
          lock: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          ),
          alert: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
          ),
          checkCircle: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          ),
        };
        return icons[name] || icons["activity"];
      };

      const ROLE_KEY = "doctor";
      const ROLE_INFO = {
        label: "Doctor",
        icon: "stethoscope",
        color: "from-indigo-500 to-violet-600",
      };

      const App = () => {
        // Configuration & Firebase References
        const [firebaseConfig] = useState(() => {
          const saved = localStorage.getItem("lc_firebase_config");
          return saved
            ? JSON.parse(saved)
            : {
                apiKey: "AIzaSyAYN9lsXTxwoL9mqvPs2YbTnrYaIXAgOFE",
                authDomain: "lifecare360-968fd.firebaseapp.com",
                databaseURL:
                  "https://lifecare360-968fd-default-rtdb.firebaseio.com",
                projectId: "lifecare360-968fd",
                storageBucket: "lifecare360-968fd.firebasestorage.app",
                messagingSenderId: "872526740925",
                appId: "1:872526740925:web:0feb7f631660778089e6d4",
              };
        });

        const [firebaseApp, setFirebaseApp] = useState(null);
        const [auth, setAuth] = useState(null);
        const [db, setDb] = useState(null);

        // Routing / UI States
        const [currentScreen, setCurrentScreen] = useState("loading");
        const [toasts, setToasts] = useState([]);
        const [user, setUser] = useState(null);
        const [profile, setProfile] = useState(null);
        const [loading, setLoading] = useState(false);

        const showToast = (message, type = "success") => {
          const id = Date.now();
          setToasts((prev) => [...prev, { id, message, type }]);
          setTimeout(() => {
            setToasts((prev) => prev.filter((t) => t.id !== id));
          }, 4000);
        };

        // Initialize Firebase App
        useEffect(() => {
          if (firebaseConfig.apiKey) {
            try {
              const app = initializeApp(firebaseConfig);
              const authInstance = getAuth(app);
              const dbInstance = getDatabase(app);
              setFirebaseApp(app);
              setAuth(authInstance);
              setDb(dbInstance);
            } catch (err) {
              console.error("Firebase Init Error:", err);
              showToast(
                "Failed to initialize Firebase. Verify settings.",
                "error",
              );
            }
          }
        }, [firebaseConfig]);

        // Auth State Listener
        useEffect(() => {
          if (!auth || !db) return;
          const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
            if (currentUser) {
              setUser(currentUser);
              setLoading(true);
              try {
                const userRef = ref(db, `users/${currentUser.uid}`);
                const snapshot = await get(userRef);
                if (snapshot.exists()) {
                  const data = snapshot.val();
                  if (data.role.toLowerCase() !== ROLE_KEY) {
                    showToast("Mismatched Role: Access denied.", "error");
                    await signOut(auth);
                    setUser(null);
                    setProfile(null);
                    window.location.hash = "login";
                    setCurrentScreen("login");
                  } else {
                    setProfile(data);
                    setCurrentScreen("dashboard");
                    window.location.hash = "dashboard";
                  }
                } else {
                  showToast("User profile not found in database.", "error");
                  await signOut(auth);
                  setUser(null);
                  setProfile(null);
                  window.location.hash = "login";
                  setCurrentScreen("login");
                }
              } catch (err) {
                console.error(err);
                showToast("Error checking user profile.", "error");
                await signOut(auth);
              } finally {
                setLoading(false);
              }
            } else {
              setUser(null);
              setProfile(null);
              if (
                window.location.hash === "#dashboard" ||
                window.location.hash === ""
              ) {
                window.location.hash = "login";
                setCurrentScreen("login");
              } else {
                handleHashRouting();
              }
            }
          });
          return () => unsubscribe();
        }, [auth, db]);

        const handleHashRouting = () => {
          const hash = window.location.hash.replace("#", "");
          if (hash === "signup") {
            setCurrentScreen("signup");
          } else if (hash === "forgot-password") {
            setCurrentScreen("forgot-password");
          } else if (hash === "dashboard") {
            setCurrentScreen("dashboard");
          } else {
            setCurrentScreen("login");
          }
        };

        useEffect(() => {
          window.addEventListener("hashchange", handleHashRouting);
          return () =>
            window.removeEventListener("hashchange", handleHashRouting);
        }, [auth]);

        const logLoginActivity = async (email, status, userId = "") => {
          if (!db) return;
          try {
            const logRef = push(ref(db, "loginActivity"));
            await set(logRef, {
              userId: userId,
              role: ROLE_KEY,
              email: email,
              timestamp: serverTimestamp(),
              status: status,
            });
          } catch (err) {
            console.error("Activity Logging Error:", err);
          }
        };

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 relative overflow-hidden">
            {/* Header */}
            <header className="bg-white border-b border-slate-100 py-4 px-6 flex justify-between items-center z-10 shadow-sm">
              <div
                className="flex items-center gap-3 cursor-pointer"
                onClick={() => (window.location.href = "index.html")}
              >
                <div className="bg-brand-500 text-white p-2 rounded-xl shadow-md shadow-brand-500/20">
                  <Icon name="activity" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-extrabold text-xl tracking-tight text-slate-900">
                    LIFECARE<span className="text-brand-500">360</span>
                  </h1>
                  <p className="text-[10px] text-slate-400 font-medium tracking-wide uppercase">
                    Connected Care Network
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-4">
                {user && (
                  <button
                    onClick={async () => {
                      setLoading(true);
                      try {
                        await signOut(auth);
                        showToast("Logged out successfully.");
                        window.location.hash = "login";
                      } catch (err) {
                        showToast("Logout failed.", "error");
                      } finally {
                        setLoading(false);
                      }
                    }}
                    className="px-4 py-2 text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-xl font-bold flex items-center gap-2 text-sm transition"
                  >
                    <Icon name="logout" className="w-4 h-4" />
                    Logout
                  </button>
                )}
              </div>
            </header>

            {/* Main Area */}
            <main className="flex-1 flex flex-col justify-center items-center p-4 md:p-8 relative">
              {loading && (
                <div className="absolute inset-0 bg-white/70 flex justify-center items-center z-50 transition duration-300">
                  <div className="flex flex-col items-center gap-3">
                    <div className="animate-spin rounded-full h-12 w-12 border-4 border-brand-500 border-t-transparent shadow-md"></div>
                    <span className="text-sm font-bold text-slate-500">
                      Loading Doctor Portal...
                    </span>
                  </div>
                </div>
              )}

              {currentScreen === "loading" && (
                <div className="flex flex-col items-center gap-3">
                  <div className="animate-spin rounded-full h-12 w-12 border-4 border-brand-500 border-t-transparent shadow-md"></div>
                  <span className="text-sm font-bold text-slate-500">
                    Initializing...
                  </span>
                </div>
              )}

              {currentScreen === "login" && (
                <LoginScreen
                  auth={auth}
                  db={db}
                  logLoginActivity={logLoginActivity}
                  showToast={showToast}
                  setLoading={setLoading}
                />
              )}

              {currentScreen === "signup" && (
                <SignUpScreen
                  auth={auth}
                  db={db}
                  showToast={showToast}
                  setLoading={setLoading}
                />
              )}

              {currentScreen === "forgot-password" && (
                <ForgotPasswordScreen
                  auth={auth}
                  showToast={showToast}
                  setLoading={setLoading}
                />
              )}

              {currentScreen === "dashboard" && (
                <DashboardContainer
                  user={user}
                  profile={profile}
                  db={db}
                  showToast={showToast}
                />
              )}
            </main>

            {/* Toast Container */}
            <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2">
              {toasts.map((t) => (
                <div
                  key={t.id}
                  className={`flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl border text-sm font-semibold transition duration-300 animate-slide-in ${
                    t.type === "success"
                      ? "bg-emerald-50 text-emerald-800 border-emerald-100"
                      : "bg-rose-50 text-rose-800 border-rose-100"
                  }`}
                >
                  <Icon
                    name={t.type === "success" ? "checkCircle" : "alert"}
                    className={`w-5 h-5 ${t.type === "success" ? "text-emerald-500" : "text-rose-500"}`}
                  />
                  <span>{t.message}</span>
                </div>
              ))}
            </div>

            {/* Footer */}
            <footer className="py-4 text-center text-xs font-semibold text-slate-400 bg-white border-t border-slate-100">
              &copy; {new Date().getFullYear()} Lifecare360 Network. Connected
              Care. Anytime. Anywhere.
            </footer>
          </div>
        );
      };

      // --- DASHBOARDS ROUTER ---
      const DashboardContainer = ({ user, profile, db, showToast }) => {
        const roleProfile = profile || {
          name: "Doctor",
          email: "",
          role: "doctor",
        };

        return (
          <div className="w-full max-w-6xl mx-auto space-y-8 animate-fade-in py-4">
            {/* User Welcome Header Banner */}
            <div className="bg-white border border-slate-100 rounded-3xl p-6 md:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-sm relative overflow-hidden">
              <div
                className={`absolute left-0 inset-y-0 w-3 bg-gradient-to-b ${ROLE_INFO.color}`}
              ></div>
              <div>
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="text-xs font-bold uppercase tracking-widest text-slate-400">
                    Secure Node Dashboard
                  </span>
                  <span
                    className={`px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-brand-50 text-brand-600 border border-brand-100`}
                  >
                    {ROLE_INFO.label}
                  </span>
                </div>
                <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">
                  Welcome back, {roleProfile.name}
                </h2>
                <p className="text-slate-500 text-sm font-medium mt-1">
                  Node Reference ID:{" "}
                  <span className="font-mono text-slate-600 bg-slate-50 px-2 py-0.5 rounded border border-slate-100">
                    {user?.uid}
                  </span>
                </p>
              </div>

              <div className="bg-slate-50 border border-slate-100 p-4 rounded-2xl flex flex-col gap-1 text-xs font-semibold text-slate-500 max-w-xs w-full md:w-auto">
                <div>
                  Email:{" "}
                  <span className="text-slate-800 font-bold">
                    {roleProfile.email}
                  </span>
                </div>
                {roleProfile.phone && (
                  <div>
                    Phone:{" "}
                    <span className="text-slate-800 font-bold">
                      {roleProfile.phone}
                    </span>
                  </div>
                )}
                <div>
                  Registered:{" "}
                  <span className="text-slate-800 font-bold">
                    {roleProfile.createdAt
                      ? new Date(roleProfile.createdAt).toLocaleDateString()
                      : "N/A"}
                  </span>
                </div>
              </div>
            </div>

            <DoctorDashboard profile={roleProfile} db={db} />
          </div>
        );
      };

      // --- SUB-DASHBOARD: DOCTOR ---
      const DoctorDashboard = ({ profile, db }) => {
        const [appointments, setAppointments] = useState([]);
        const [myAvailability, setMyAvailability] = useState(
          profile.availability || "Available",
        );
        const [triageFilter, setTriageFilter] = useState("specialty"); // specialty vs all
        const [triageSearchText, setTriageSearchText] = useState("");
        const [currentTime, setCurrentTime] = useState(new Date());

        // Priority recalculation ticker
        useEffect(() => {
          const interval = setInterval(() => {
            setCurrentTime(new Date());
          }, 15000);
          return () => clearInterval(interval);
        }, []);

        // Listen to appointments and self availability
        useEffect(() => {
          if (!db || !profile) return;

          const apptsRef = ref(db, "appointments");
          const unsubscribeAppts = onValue(apptsRef, (snapshot) => {
            if (snapshot.exists()) {
              setAppointments(
                Object.entries(snapshot.val()).map(([id, val]) => ({
                  id,
                  ...val,
                })),
              );
            } else {
              setAppointments([]);
            }
          });

          // Listen for live updates to availability
          const statusRef = ref(db, `users/${profile.uid}/availability`);
          const unsubscribeStatus = onValue(statusRef, (snapshot) => {
            if (snapshot.exists()) {
              setMyAvailability(snapshot.val());
            }
          });

          return () => {
            unsubscribeAppts();
            unsubscribeStatus();
          };
        }, [db, profile]);

        const toggleMyStatus = async () => {
          if (!db || !profile) return;
          const newStatus =
            myAvailability === "Available" ? "Unavailable" : "Available";
          try {
            await set(ref(db, `users/${profile.uid}/availability`), newStatus);
          } catch (err) {
            console.error("Failed to toggle availability:", err);
          }
        };

        const updateAppointmentStatus = async (apptId, status) => {
          if (!db) return;
          try {
            await set(ref(db, `appointments/${apptId}/status`), status);
          } catch (err) {
            console.error("Failed to update appointment:", err);
          }
        };

        const generatePrescription = async (appt) => {
          const diagnosis = window.prompt(
            "Enter diagnosis:",
            appt.condition || "",
          );
          if (diagnosis === null) return;
          const advice = window.prompt(
            "Enter medical advice or prescription:",
            "Rest, hydrate, and follow up as advised.",
          );
          if (advice === null) return;
          try {
            const { id, ...appointmentData } = appt;
            await set(ref(db, `appointments/${appt.id}`), {
              ...appointmentData,
              diagnosis,
              prescription: advice,
              status: "Prescription Generated",
              completedAt: new Date().toISOString(),
            });
          } catch (err) {
            console.error("Failed to generate prescription:", err);
          }
        };

        const completeTreatment = async (apptId) => {
          if (!db) return;
          try {
            // Clear active assignment on completion
            const updates = {
              [`appointments/${apptId}/arrivalStatus`]: "Completed",
              [`appointments/${apptId}/assignedDoctorId`]: null,
              [`appointments/${apptId}/assignedDoctorName`]: null,
            };
            await set(ref(db), {
              ...updates,
            });
          } catch (err) {
            console.error(err);
          }
        };

        // Priority scoring formula
        const calculatePriorityScore = (appt) => {
          if (appt.arrivalStatus !== "Arrived") return 0;
          let score = 0;

          // 1. Urgency Level
          if (appt.urgency === "Critical") score += 1000;
          else if (appt.urgency === "Moderate") score += 500;
          else score += 100;

          // 2. Waiting Time
          if (appt.arrivalTime) {
            const mins = Math.max(
              0,
              Math.floor((currentTime - new Date(appt.arrivalTime)) / 60000),
            );
            score += mins * 10;
          }

          // 3. Age category boost
          const age = parseInt(appt.age) || 0;
          if (age >= 65 || age <= 5) score += 50;

          // 4. Lateness penalty
          if (appt.previousStatus === "Late") {
            score -= 100;
          }

          return score;
        };

        // Waiting list calculation
        const queueWithScores = appointments
          .filter((a) => a.arrivalStatus === "Arrived")
          .map((a) => ({
            ...a,
            priorityScore: calculatePriorityScore(a),
          }))
          .sort((a, b) => {
            if (b.priorityScore !== a.priorityScore) {
              return b.priorityScore - a.priorityScore;
            }
            return a.appointmentTime.localeCompare(b.appointmentTime);
          });

        // Doctor's assigned active queue
        const myAssignedPatients = queueWithScores.filter(
          (a) => a.assignedDoctorId === profile.uid,
        );
        const myAppointments = appointments.filter(
          (a) =>
            a.doctorId === profile.uid || a.assignedDoctorId === profile.uid,
        );

        // Global Triage Queue (filtered by specialty/search text)

                    <span className="text-slate-800 font-extrabold block mt-1">

      // --- LOGIN SCREEN ---
      const LoginScreen = ({
        auth,
        db,
        logLoginActivity,
        showToast,
        setLoading,
      }) => {
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [showPassword, setShowPassword] = useState(false);

        const handleLogin = async (e) => {
          e.preventDefault();
          if (!auth) {
            showToast("Firebase must be configured first.", "error");
            return;
          }
          setLoading(true);
          try {
            const userCredential = await signInWithEmailAndPassword(
              auth,
              email,
              password,
            );
            const loggedInUser = userCredential.user;

            const snapshot = await get(ref(db, `users/${loggedInUser.uid}`));
            if (snapshot.exists()) {
              const dbProfile = snapshot.val();
              const dbRole = dbProfile.role.toLowerCase();

              if (dbRole !== ROLE_KEY) {
                showToast(
                  `Access Mismatch: This account is registered as a ${dbProfile.role}.`,
                  "error",
                );
                await logLoginActivity(
                  email,
                  `Failed (Role Mismatch: ${dbRole})`,
                  loggedInUser.uid,
                );
                await signOut(auth);
              } else {
                showToast("Login successful!");
                await logLoginActivity(email, "Success", loggedInUser.uid);
                window.location.hash = "dashboard";
              }
            } else {
              showToast("User profile node missing in database.", "error");
              await signOut(auth);
            }
          } catch (err) {
            console.error(err);
            let errorMsg = "Login failed: Incorrect email or password.";
            if (
              err.code === "auth/invalid-credential" ||
              err.code === "auth/wrong-password"
            ) {
              errorMsg = "Incorrect password or login details.";
            }
            showToast(errorMsg, "error");
            await logLoginActivity(email, "Failed");
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="w-full max-w-md bg-white border border-slate-100 rounded-3xl p-8 shadow-xl relative overflow-hidden">
            <div
              className={`absolute top-0 inset-x-0 h-2 bg-gradient-to-r ${ROLE_INFO.color}`}
            ></div>

            <div className="text-center mb-6">
              <div
                className={`w-14 h-14 rounded-2xl bg-gradient-to-tr ${ROLE_INFO.color} text-white flex items-center justify-center mx-auto mb-4 shadow-lg`}
              >
                <Icon name={ROLE_INFO.icon} className="w-7 h-7" />
              </div>
              <h2 className="text-2xl font-extrabold text-slate-800">
                {ROLE_INFO.label} Log In
              </h2>
              <p className="text-sm font-semibold text-slate-400 mt-1">
                LIFECARE360 Access Portal
              </p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                  Email Address
                </label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium text-slate-800"
                  placeholder="Enter registered email"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                  Password
                </label>
                <div className="relative">
                  <input
                    type={showPassword ? "text" : "password"}
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium text-slate-800 pr-12"
                    placeholder="Enter password"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword((prev) => !prev)}
                    className="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600"
                  >
                    <Icon
                      name={showPassword ? "eyeOff" : "eye"}
                      className="w-5 h-5"
                    />
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between text-sm">
                <label className="flex items-center gap-2 text-slate-500 cursor-pointer font-semibold">

                    type="checkbox"
                    className="w-4 h-4 rounded text-brand-500 border-slate-300 focus:ring-brand-500"
                  />
                  Remember Me
                </label>
                <a

                  className="text-brand-600 hover:text-brand-700 font-bold"

              >

              <p className="text-sm font-semibold text-slate-500">

              </a>

          </div>
        );
      };

      // --- SIGN UP SCREEN ---
      const SignUpScreen = ({ auth, db, showToast, setLoading }) => {
        const [formData, setFormData] = useState({});
        const [errors, setErrors] = useState({});
        const [showPassword, setShowPassword] = useState(false);

        const handleFieldChange = (field, value) => {
          setFormData((prev) => ({ ...prev, [field]: value }));
          if (errors[field]) setErrors((prev) => ({ ...prev, [field]: null }));
        };

        const handleSignUp = async (e) => {
          e.preventDefault();

          const newErrors = {};
          if (formData.password !== formData.confirmPassword) {
            newErrors.confirmPassword = "Passwords do not match.";
          }
          if (formData.password && formData.password.length < 6) {
            newErrors.password = "Password must be at least 6 characters.";
          }

          if (Object.keys(newErrors).length > 0) {
            setErrors(newErrors);
            return;
          }

          if (!auth) {
            showToast("Firebase must be configured first.", "error");
            return;
          }

          setLoading(true);
          try {
            const userCredential = await createUserWithEmailAndPassword(
              auth,
              formData.email,
              formData.password,
            );
            const newUser = userCredential.user;

            const profileNode = {
              uid: newUser.uid,
              name: formData.doctorName || "Dr. Lifecare",
              email: formData.email,
              phone: formData.phone || "",
              role: ROLE_KEY,
              medicalRegNumber: formData.medicalRegNumber || "",
              specialization: formData.specialization || "General Medicine",
              hospital: formData.hospital || "",
              approved: false, // Requires admin approval
              pendingVerification: true,
              availability: "Available",
              createdAt: new Date().toISOString(),
            };

            const doctorNode = {
              doctorId: newUser.uid,
              name: formData.doctorName || "Dr. Lifecare",
              specialization: formData.specialization || "General Medicine",
              hospital: formData.hospital || "",
              experience: 5,
              fee: 30,
              rating: 5.0,
              availability: "Available",
              todaySlots: [
                "09:00 AM",
                "09:30 AM",
                "10:00 AM",
                "11:00 AM",
                "11:30 AM",
              ],
              onlineConsultation: true,
              latitude: 13.0827,
              longitude: 80.2707,
              currentPatients: 0,
              averageConsultationTime: 15,
              languages: "English",
            };

            await set(ref(db, `users/${newUser.uid}`), profileNode);
            await set(ref(db, `doctors/${newUser.uid}`), doctorNode);
            showToast(
              "Registration successful! Doctor profile pending verification.",
            );
            window.location.hash = "dashboard";
          } catch (err) {
            console.error(err);
            let msg = "Signup failed. Review field values.";
            if (err.code === "auth/email-already-in-use") {
              msg = "Email address is already registered.";
            }
            showToast(msg, "error");
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="w-full max-w-2xl bg-white border border-slate-100 rounded-3xl p-8 shadow-xl relative overflow-hidden my-6">
            <div
              className={`absolute top-0 inset-x-0 h-2 bg-gradient-to-r ${ROLE_INFO.color}`}
            ></div>

            <div className="text-center mb-6">
              <div
                className={`w-14 h-14 rounded-2xl bg-gradient-to-tr ${ROLE_INFO.color} text-white flex items-center justify-center mx-auto mb-4 shadow-lg`}
              >
                <Icon name={ROLE_INFO.icon} className="w-7 h-7" />
              </div>
              <h2 className="text-2xl font-extrabold text-slate-800">
                {ROLE_INFO.label} Registration
              </h2>
              <p className="text-sm font-semibold text-slate-400 mt-1">
                Register new doctor authentication node
              </p>
            </div>

            <form onSubmit={handleSignUp} className="space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                <FormField
                  label="Doctor Full Name"
                  type="text"
                  required
                  onChange={(v) => handleFieldChange("doctorName", v)}
                />
                <FormField
                  label="Medical Registration Number"
                  type="text"
                  required
                  onChange={(v) => handleFieldChange("medicalRegNumber", v)}
                />
                <FormSelect
                  label="Specialization"
                  options={[
                    "General Medicine",
                    "Cardiology",
                    "Neurology",
                    "Pediatrics",
                    "Orthopedics",
                    "Emergency Medicine",
                  ]}
                  onChange={(v) => handleFieldChange("specialization", v)}
                />
                <FormField
                  label="Affiliated Hospital"
                  type="text"
                  required
                  onChange={(v) => handleFieldChange("hospital", v)}
                />
                <FormField
                  label="Contact Phone Number"
                  type="tel"
                  required
                  onChange={(v) => handleFieldChange("phone", v)}
                />

                <div className="md:col-span-2 border-t border-slate-100 pt-5 mt-2 grid grid-cols-1 md:grid-cols-2 gap-5">
                  <FormField
                    label="Email Address"
                    type="email"
                    required
                    onChange={(v) => handleFieldChange("email", v)}
                  />
                  <div className="h-1 flex md:hidden col-span-1"></div>

                  <div>
                    <FormField
                      label="Password"
                      type={showPassword ? "text" : "password"}
                      required
                      onChange={(v) => handleFieldChange("password", v)}
                    />
                    {errors.password && (
                      <span className="text-xs text-rose-500 font-bold mt-1 block">
                        {errors.password}
                      </span>
                    )}
                  </div>

                  <div>
                    <FormField
                      label="Confirm Password"
                      type={showPassword ? "text" : "password"}
                      required
                      onChange={(v) => handleFieldChange("confirmPassword", v)}
                    />
                    {errors.confirmPassword && (
                      <span className="text-xs text-rose-500 font-bold mt-1 block">
                        {errors.confirmPassword}
                      </span>
                    )}
                  </div>

                  <div className="md:col-span-2 flex items-center justify-between">
                    <label className="flex items-center gap-2 text-sm text-slate-500 font-semibold cursor-pointer">
                      <input
                        type="checkbox"
                        className="w-4 h-4 rounded text-brand-500 border-slate-300 focus:ring-brand-500"
                        onChange={(e) => setShowPassword(e.target.checked)}
                      />
                      Show Passwords
                    </label>
                  </div>
                </div>
              </div>

              <button
                type="submit"
                className={`w-full py-4 rounded-xl font-extrabold text-white bg-gradient-to-r ${ROLE_INFO.color} shadow-lg transition`}
              >
                Submit Registration
              </button>
            </form>

            <div className="mt-6 pt-6 border-t border-slate-100 flex flex-col gap-3 text-center">
              <p className="text-sm font-semibold text-slate-500">
                Already have an account?{" "}
                <a
                  href="#login"
                  className="text-brand-600 hover:text-brand-700 font-bold"
                >
                  Log In
                </a>
              </p>
              <a
                href="index.html"
                className="text-sm font-bold text-slate-400 hover:text-slate-600"
              >
                Back to Role Portal
              </a>
            </div>
          </div>
        );
      };

      // Helper Form Field Component
      const FormField = ({
        label,
        type = "text",
        placeholder,
        required,
        onChange,
        className = "",
      }) => {
        const inputClass =
          "w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium text-slate-800";
        return (
          <div className={`flex flex-col ${className}`}>
            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
              {label}
            </label>
            {type === "textarea" ? (
              <textarea
                required={required}
                placeholder={placeholder || `Enter ${label.toLowerCase()}`}
                onChange={(e) => onChange(e.target.value)}
                rows={3}
                className={inputClass}
              />
            ) : (
              <input
                type={type}
                required={required}
                placeholder={placeholder || `Enter ${label.toLowerCase()}`}
                onChange={(e) => onChange(e.target.value)}
                className={inputClass}
              />
            )}
          </div>
        );
      };

      // Helper Select Component
      const FormSelect = ({ label, options, onChange, className = "" }) => {
        return (
          <div className={`flex flex-col ${className}`}>
            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
              {label}
            </label>
            <select
              required
              onChange={(e) => onChange(e.target.value)}
              className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none bg-white focus:border-brand-500 font-medium text-slate-800 text-sm"
            >
              <option value="">Select option</option>
              {options.map((opt, i) => (
                <option key={i} value={opt}>
                  {opt}
                </option>
              ))}
            </select>
          </div>
        );
      };

      // --- FORGOT PASSWORD SCREEN ---
      const ForgotPasswordScreen = ({ auth, showToast, setLoading }) => {
        const [email, setEmail] = useState("");
        const [sent, setSent] = useState(false);

        const handleReset = async (e) => {
          e.preventDefault();
          if (!auth) {
            showToast("Firebase must be configured first.", "error");
            return;
          }
          setLoading(true);
          try {
            await sendPasswordResetEmail(auth, email);
            showToast("Password reset link sent to your email.");
            setSent(true);
          } catch (err) {
            console.error(err);
            showToast(
              "Failed to send reset link. Ensure the email is correct.",
              "error",
            );
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="w-full max-w-md bg-white border border-slate-100 rounded-3xl p-8 shadow-xl relative overflow-hidden">
            <div className="absolute top-0 inset-x-0 h-2 bg-brand-500"></div>

            <div className="text-center mb-6">
              <div className="w-14 h-14 rounded-2xl bg-brand-50 text-brand-500 flex items-center justify-center mx-auto mb-4">
                <Icon name="lock" className="w-7 h-7" />
              </div>
              <h2 className="text-2xl font-extrabold text-slate-800">
                Password Reset
              </h2>
              <p className="text-sm font-semibold text-slate-400 mt-1">
                LIFECARE360 Recovery Node
              </p>
            </div>

            {!sent ? (
              <form onSubmit={handleReset} className="space-y-4">
                <p className="text-sm text-slate-500 font-medium leading-relaxed">
                  Enter your registered email address and we'll send you a
                  secure link to reset your workspace password.
                </p>
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                    Email Address
                  </label>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium"
                    placeholder="name@hospital.com"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-xl font-extrabold text-white bg-brand-500 hover:bg-brand-600 shadow-md transition"
                >
                  Send Reset Link
                </button>
              </form>
            ) : (
              <div className="text-center py-4 space-y-4">
                <div className="bg-emerald-50 text-emerald-600 p-4 rounded-2xl border border-emerald-100">
                  <p className="text-sm font-bold">Email Sent Successfully!</p>
                  <p className="text-xs font-medium mt-1">
                    Check your inbox ({email}) for further instructions.
                  </p>
                </div>
                <button
                  onClick={() => setSent(false)}
                  className="text-sm font-bold text-brand-600 hover:underline"
                >
                  Try Another Email
                </button>
              </div>
            )}

            <div className="mt-6 pt-6 border-t border-slate-100 text-center">
              <a
                href="#login"
                className="text-sm font-bold text-slate-400 hover:text-slate-600"
              >
                Back to Login
              </a>
            </div>
          </div>
        );
      };

      // Render the React Application
      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
