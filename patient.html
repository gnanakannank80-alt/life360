<!doctype html>
<html lang="en" class="h-full bg-slate-50">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lifecare360 Patient Portal</title>
    <link rel="icon" href="life.jpeg" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM 18 -->
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <!-- Babel Standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
        100% {
          transform: scale(0.95);
          opacity: 0.5;
        }
      }
      .pulse-logo {
        animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes slide-in {
        from {
          transform: translateY(1rem);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-in {
        animation: slide-in 0.3s ease-out forwards;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.4s ease-out forwards;
      }
      @keyframes loading-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f0fdfa",
                100: "#ccfbf1",
                500: "#14b8a6",
                600: "#0d9488",
                700: "#0f766e",
                900: "#115e59",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="h-full text-slate-800">
    <div id="root" class="h-full"></div>

    <!-- Main script block executing JSX and ES Modules -->
    <script type="text/babel" data-type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        signOut,
        sendPasswordResetEmail,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getDatabase,
        ref,
        set,
        get,
        child,
        push,
        onValue,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

      const { useState, useEffect, useRef } = React;

      // --- Embedded Custom SVG Icons (Lucide replacements) ---
      const Icon = ({ name, className = "w-6 h-6", ...props }) => {
        const icons = {
          activity: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
          ),
          user: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          ),
          droplet: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M12 22a7 7 0 0 0 7-7c0-4.3-7-11-7-11S5 10.7 5 15a7 7 0 0 0 7 7z" />
            </svg>
          ),
          eye: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          ),
          eyeOff: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <line x1="2" y1="2" x2="22" y2="22" />
            </svg>
          ),
          logout: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          ),
          lock: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          ),
          alert: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
          ),
          checkCircle: (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          ),
        };
        return icons[name] || icons["activity"];
      };

      const ROLE_KEY = "patient";
      const ROLE_INFO = {
        label: "Patient",
        icon: "user",
        color: "from-teal-500 to-emerald-600",
      };

      const App = () => {
        // Configuration & Firebase References
        const [firebaseConfig] = useState(() => {
          const saved = localStorage.getItem("lc_firebase_config");
          return saved
            ? JSON.parse(saved)
            : {
                apiKey: "AIzaSyAYN9lsXTxwoL9mqvPs2YbTnrYaIXAgOFE",
                authDomain: "lifecare360-968fd.firebaseapp.com",
                databaseURL:
                  "https://lifecare360-968fd-default-rtdb.firebaseio.com",
                projectId: "lifecare360-968fd",
                storageBucket: "lifecare360-968fd.firebasestorage.app",
                messagingSenderId: "872526740925",
                appId: "1:872526740925:web:0feb7f631660778089e6d4",
              };
        });

        const [firebaseApp, setFirebaseApp] = useState(null);
        const [auth, setAuth] = useState(null);
        const [db, setDb] = useState(null);

        // Routing / UI States
        const [currentScreen, setCurrentScreen] = useState("loading");
        const [toasts, setToasts] = useState([]);
        const [user, setUser] = useState(null);
        const [profile, setProfile] = useState(null);
        const [loading, setLoading] = useState(false);

        const showToast = (message, type = "success") => {
          const id = Date.now();
          setToasts((prev) => [...prev, { id, message, type }]);
          setTimeout(() => {
            setToasts((prev) => prev.filter((t) => t.id !== id));
          }, 4000);
        };

        // Initialize Firebase App
        useEffect(() => {
          if (firebaseConfig.apiKey) {
            try {
              const app = initializeApp(firebaseConfig);
              const authInstance = getAuth(app);
              const dbInstance = getDatabase(app);
              setFirebaseApp(app);
              setAuth(authInstance);
              setDb(dbInstance);
            } catch (err) {
              console.error("Firebase Init Error:", err);
              showToast(
                "Failed to initialize Firebase. Verify settings.",
                "error",
              );
            }
          }
        }, [firebaseConfig]);

        // Auth State Listener
        useEffect(() => {
          if (!auth || !db) return;
          const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
            if (currentUser) {
              setUser(currentUser);
              setLoading(true);
              try {
                const userRef = ref(db, `users/${currentUser.uid}`);
                const snapshot = await get(userRef);
                if (snapshot.exists()) {
                  const data = snapshot.val();
                  if (data.role.toLowerCase() !== ROLE_KEY) {
                    showToast("Mismatched Role: Access denied.", "error");
                    await signOut(auth);
                    setUser(null);
                    setProfile(null);
                    window.location.hash = "login";
                    setCurrentScreen("login");
                  } else {
                    setProfile(data);
                    setCurrentScreen("dashboard");
                    window.location.hash = "dashboard";
                  }
                } else {
                  showToast("User profile not found in database.", "error");
                  await signOut(auth);
                  setUser(null);
                  setProfile(null);
                  window.location.hash = "login";
                  setCurrentScreen("login");
                }
              } catch (err) {
                console.error(err);
                showToast("Error checking user profile.", "error");
                await signOut(auth);
              } finally {
                setLoading(false);
              }
            } else {
              setUser(null);
              setProfile(null);
              // Default to login if not authenticated
              if (
                window.location.hash === "#dashboard" ||
                window.location.hash === ""
              ) {
                window.location.hash = "login";
                setCurrentScreen("login");
              } else {
                handleHashRouting();
              }
            }
          });
          return () => unsubscribe();
        }, [auth, db]);

        const handleHashRouting = () => {
          const hash = window.location.hash.replace("#", "");
          if (hash === "signup") {
            setCurrentScreen("signup");
          } else if (hash === "forgot-password") {
            setCurrentScreen("forgot-password");
          } else if (hash === "dashboard") {
            setCurrentScreen("dashboard");
          } else {
            setCurrentScreen("login");
          }
        };

        // Hash Router Listener
        useEffect(() => {
          window.addEventListener("hashchange", handleHashRouting);
          return () =>
            window.removeEventListener("hashchange", handleHashRouting);
        }, [auth]);

        const logLoginActivity = async (email, status, userId = "") => {
          if (!db) return;
          try {
            const logRef = push(ref(db, "loginActivity"));
            await set(logRef, {
              userId: userId,
              role: ROLE_KEY,
              email: email,
              timestamp: serverTimestamp(),
              status: status,
            });
          } catch (err) {
            console.error("Activity Logging Error:", err);
          }
        };

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 relative overflow-hidden">
            {/* Header */}
            <header className="bg-white border-b border-slate-100 py-4 px-6 flex justify-between items-center z-10 shadow-sm">
              <div
                className="flex items-center gap-3 cursor-pointer"
                onClick={() => (window.location.href = "index.html")}
              >
                <div className="bg-brand-500 text-white p-2 rounded-xl shadow-md shadow-brand-500/20">
                  <Icon name="activity" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-extrabold text-xl tracking-tight text-slate-900">
                    LIFECARE<span className="text-brand-500">360</span>
                  </h1>
                  <p className="text-[10px] text-slate-400 font-medium tracking-wide uppercase">
                    Connected Care Network
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-4">
                {user && (
                  <button
                    onClick={async () => {
                      setLoading(true);
                      try {
                        await signOut(auth);
                        showToast("Logged out successfully.");
                        window.location.hash = "login";
                      } catch (err) {
                        showToast("Logout failed.", "error");
                      } finally {
                        setLoading(false);
                      }
                    }}
                    className="px-4 py-2 text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-xl font-bold flex items-center gap-2 text-sm transition"
                  >
                    <Icon name="logout" className="w-4 h-4" />
                    Logout
                  </button>
                )}
              </div>
            </header>

            {/* Main Area */}
            <main className="flex-1 flex flex-col justify-center items-center p-4 md:p-8 relative">
              {loading && (
                <div className="absolute inset-0 bg-white/70 flex justify-center items-center z-50 transition duration-300">
                  <div className="flex flex-col items-center gap-3">
                    <div className="animate-spin rounded-full h-12 w-12 border-4 border-brand-500 border-t-transparent shadow-md"></div>
                    <span className="text-sm font-bold text-slate-500">
                      Loading Patient Portal...
                    </span>
                  </div>
                </div>
              )}

              {currentScreen === "loading" && (
                <div className="flex flex-col items-center gap-3">
                  <div className="animate-spin rounded-full h-12 w-12 border-4 border-brand-500 border-t-transparent shadow-md"></div>
                  <span className="text-sm font-bold text-slate-500">
                    Initializing...
                  </span>
                </div>
              )}

              {currentScreen === "login" && (
                <LoginScreen
                  auth={auth}
                  db={db}
                  logLoginActivity={logLoginActivity}
                  showToast={showToast}
                  setLoading={setLoading}
                />
              )}

              {currentScreen === "signup" && (
                <SignUpScreen
                  auth={auth}
                  db={db}
                  showToast={showToast}
                  setLoading={setLoading}
                />
              )}

              {currentScreen === "forgot-password" && (
                <ForgotPasswordScreen
                  auth={auth}
                  showToast={showToast}
                  setLoading={setLoading}
                />
              )}

              {currentScreen === "dashboard" && (
                <DashboardContainer
                  user={user}
                  profile={profile}
                  db={db}
                  showToast={showToast}
                />
              )}
            </main>

            {/* Toast Container */}
            <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2">
              {toasts.map((t) => (
                <div
                  key={t.id}
                  className={`flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl border text-sm font-semibold transition duration-300 animate-slide-in ${
                    t.type === "success"
                      ? "bg-emerald-50 text-emerald-800 border-emerald-100"
                      : "bg-rose-50 text-rose-800 border-rose-100"
                  }`}
                >
                  <Icon
                    name={t.type === "success" ? "checkCircle" : "alert"}
                    className={`w-5 h-5 ${t.type === "success" ? "text-emerald-500" : "text-rose-500"}`}
                  />
                  <span>{t.message}</span>
                </div>
              ))}
            </div>

            {/* Footer */}
            <footer className="py-4 text-center text-xs font-semibold text-slate-400 bg-white border-t border-slate-100">
              &copy; {new Date().getFullYear()} Lifecare360 Network. Connected
              Care. Anytime. Anywhere.
            </footer>
          </div>
        );
      };

      // --- LOGIN SCREEN ---
      const LoginScreen = ({
        auth,
        db,
        logLoginActivity,
        showToast,
        setLoading,
      }) => {
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [showPassword, setShowPassword] = useState(false);

        const handleLogin = async (e) => {
          e.preventDefault();
          if (!auth) {
            showToast("Firebase must be configured first.", "error");
            return;
          }
          setLoading(true);
          try {
            const userCredential = await signInWithEmailAndPassword(
              auth,
              email,
              password,
            );
            const loggedInUser = userCredential.user;

            const snapshot = await get(ref(db, `users/${loggedInUser.uid}`));
            if (snapshot.exists()) {
              const dbProfile = snapshot.val();
              const dbRole = dbProfile.role.toLowerCase();

              if (dbRole !== ROLE_KEY) {
                showToast(
                  `Access Mismatch: This account is registered as a ${dbProfile.role}.`,
                  "error",
                );
                await logLoginActivity(
                  email,
                  `Failed (Role Mismatch: ${dbRole})`,
                  loggedInUser.uid,
                );
                await signOut(auth);
              } else {
                showToast("Login successful!");
                await logLoginActivity(email, "Success", loggedInUser.uid);
                window.location.hash = "dashboard";
              }
            } else {
              showToast("User profile node missing in database.", "error");
              await signOut(auth);
            }
          } catch (err) {
            console.error(err);
            let errorMsg = "Login failed: Incorrect email or password.";
            if (
              err.code === "auth/invalid-credential" ||
              err.code === "auth/wrong-password"
            ) {
              errorMsg = "Incorrect password or login details.";
            }
            showToast(errorMsg, "error");
            await logLoginActivity(email, "Failed");
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="w-full max-w-md bg-white border border-slate-100 rounded-3xl p-8 shadow-xl relative overflow-hidden">
            <div
              className={`absolute top-0 inset-x-0 h-2 bg-gradient-to-r ${ROLE_INFO.color}`}
            ></div>

            <div className="text-center mb-6">
              <div
                className={`w-14 h-14 rounded-2xl bg-gradient-to-tr ${ROLE_INFO.color} text-white flex items-center justify-center mx-auto mb-4 shadow-lg`}
              >
                <Icon name={ROLE_INFO.icon} className="w-7 h-7" />
              </div>
              <h2 className="text-2xl font-extrabold text-slate-800">
                {ROLE_INFO.label} Log In
              </h2>
              <p className="text-sm font-semibold text-slate-400 mt-1">
                LIFECARE360 Access Portal
              </p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                  Email Address
                </label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium text-slate-800"
                  placeholder="Enter registered email"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                  Password
                </label>
                <div className="relative">
                  <input
                    type={showPassword ? "text" : "password"}
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium text-slate-800 pr-12"
                    placeholder="Enter password"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword((prev) => !prev)}
                    className="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600"
                  >
                    <Icon
                      name={showPassword ? "eyeOff" : "eye"}
                      className="w-5 h-5"
                    />
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between text-sm">
                <label className="flex items-center gap-2 text-slate-500 cursor-pointer font-semibold">
                  <input
                    type="checkbox"
                    className="w-4 h-4 rounded text-brand-500 border-slate-300 focus:ring-brand-500"
                  />
                  Remember Me
                </label>
                <a
                  href="#forgot-password"
                  className="text-brand-600 hover:text-brand-700 font-bold"
                >
                  Forgot Password?
                </a>
              </div>

              <button
                type="submit"
                className={`w-full py-3.5 rounded-xl font-extrabold text-white bg-gradient-to-r ${ROLE_INFO.color} shadow-lg transition duration-200`}
              >
                Sign In
              </button>
            </form>

            <div className="mt-6 pt-6 border-t border-slate-100 flex flex-col gap-3 text-center">
              <p className="text-sm font-semibold text-slate-500">
                New to the platform?{" "}
                <a
                  href="#signup"
                  className="text-brand-600 hover:text-brand-700 font-bold"
                >
                  Create Node Account
                </a>
              </p>
              <a
                href="index.html"
                className="text-sm font-bold text-slate-400 hover:text-slate-600"
              >
                Back to Role Portal
              </a>
            </div>
          </div>
        );
      };

      // --- SIGN UP SCREEN ---
      const SignUpScreen = ({ auth, db, showToast, setLoading }) => {
        const [formData, setFormData] = useState({});
        const [errors, setErrors] = useState({});
        const [showPassword, setShowPassword] = useState(false);

        const handleFieldChange = (field, value) => {
          setFormData((prev) => ({ ...prev, [field]: value }));
          if (errors[field]) setErrors((prev) => ({ ...prev, [field]: null }));
        };

        const handleSignUp = async (e) => {
          e.preventDefault();

          const newErrors = {};
          if (formData.password !== formData.confirmPassword) {
            newErrors.confirmPassword = "Passwords do not match.";
          }
          if (formData.password && formData.password.length < 6) {
            newErrors.password = "Password must be at least 6 characters.";
          }

          if (Object.keys(newErrors).length > 0) {
            setErrors(newErrors);
            return;
          }

          if (!auth) {
            showToast("Firebase must be configured first.", "error");
            return;
          }

          setLoading(true);
          try {
            const userCredential = await createUserWithEmailAndPassword(
              auth,
              formData.email,
              formData.password,
            );
            const newUser = userCredential.user;

            const profileNode = {
              uid: newUser.uid,
              name: formData.fullName || "Lifecare Patient",
              email: formData.email,
              phone: formData.phone || "",
              role: ROLE_KEY,

      const PatientDashboard = ({ profile, db, showToast }) => {
        // Form fields

        // AI Wizard modal & details

        const healthConcerns = [

        const [formData, setFormData] = useState({

          emergencyLevel: "Normal",

          currentMedications: "",
          allergies: "",
          prefHospital: "Lifecare General Hospital",
          prefLanguage: "English",
          latitude: 13.0827,
          longitude: 80.2707,
        });

        const [aiRecommendation, setAiRecommendation] = useState(null);
        const [recDoctorsList, setRecDoctorsList] = useState([]);
        const [selectedDocId, setSelectedDocId] = useState(null);
        const [selectedSlot, setSelectedSlot] = useState("");
        const [selectedSlotDate, setSelectedSlotDate] = useState("Today");
        const [loadingAi, setLoadingAi] = useState(false);
        const [emergencyAlert, setEmergencyAlert] = useState(null);
        const [bookingConfirmation, setBookingConfirmation] = useState(null);

        // Active bookings list
        const [appointments, setAppointments] = useState([]);
        const [doctors, setDoctors] = useState([]);
        const [donors, setDonors] = useState([]);

        // Filter donors
        const [donorFilterType, setDonorFilterType] = useState("all");
        const [donorFilterBlood, setDonorFilterBlood] = useState("all");
        const [donorSearchLocation, setDonorSearchLocation] = useState("");

        // Modals
        const [viewPrescription, setViewPrescription] = useState(null);
        const [activeConsultation, setActiveConsultation] = useState(null);
        const [ratingDoctor, setRatingDoctor] = useState(null);
        const [userRating, setUserRating] = useState(5);
        const [chatMessage, setChatMessage] = useState("");
        const [chatHistory, setChatHistory] = useState([
          {
            sender: "doctor",
            text: "Hello! I am reviewing your health assessment results. How can I help you today?",
          },
        ]);

        // Get current GPS location on modal mount
        useEffect(() => {
          if (showWizard) {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                setFormData((prev) => ({
                  ...prev,
                  latitude: pos.coords.latitude,
                  longitude: pos.coords.longitude,
                }));
              },
              () => console.log("Using default location (Chennai)"),
            );

        // Load appointments, doctors, and donors
        useEffect(() => {
          if (!db) return;

          // Merge doctor profiles with the live availability stored under users.
          let doctorDirectory = [];
          let doctorUsers = [];
          const syncDoctors = () => {
            const profiles = new Map(
              doctorDirectory.map((doctor) => [
                doctor.doctorId || doctor.uid,
                doctor,
              ]),
            );
            doctorUsers.forEach((doctor) => {
              const key = doctor.doctorId || doctor.uid;
              profiles.set(key, {
                ...profiles.get(key),
                ...doctor,
                doctorId: key,
              });
            });
            setDoctors(
              Array.from(profiles.values()).map((doctor) => ({
                ...doctor,
                doctorId: doctor.doctorId || doctor.uid,
              })),
            );
            const nextDoctors = Array.from(profiles.values()).map((doctor) => ({
              ...doctor,
              doctorId: doctor.doctorId || doctor.uid,
            }));
            setRecDoctorsList((current) =>
              current.map(
                (doctor) =>
                  nextDoctors.find(
                    (item) => item.doctorId === doctor.doctorId,
                  ) || doctor,
              ),
            );
          };

          // Fetch doctors list
          const docsRef = ref(db, "doctors");
          const unsubscribeDoctors = onValue(docsRef, (snapshot) => {
            doctorDirectory = snapshot.exists()
              ? Object.values(snapshot.val())
              : [];
            syncDoctors();
          });

          // Fetch appointments matching this patient
          const apptsRef = ref(db, "appointments");
          onValue(apptsRef, (snapshot) => {
            if (snapshot.exists()) {
              const list = Object.entries(snapshot.val())
                .map(([id, val]) => ({ id, ...val }))
                .filter((a) => a.patientId === profile.uid);
              setAppointments(list);
            } else {
              setAppointments([]);
            }
          });

          // Fetch donors list
          const usersRef = ref(db, "users");
          const unsubscribe = onValue(usersRef, (snapshot) => {
            if (snapshot.exists()) {
              doctorUsers = Object.values(snapshot.val()).filter(
                (user) => user.role === "doctor",
              );
              syncDoctors();
              const list = Object.values(snapshot.val()).filter(
                (u) => u.role === "donor_blood" || u.role === "donor_organ",
              );
              setDonors(list);
            } else {
              setDonors([]);
            }
          });
          return () => {
            unsubscribeDoctors();
            unsubscribe();
          };
        }, [db, profile]);

        const triggerEmergency = async (e) => {
          e.preventDefault();
          if (!db) return;
          const safeProfile = profile || {};

            showToast(`Emergency broadcast sent! Urgency: ${urgency}`);

        const reportAssessmentEmergency = async (requestAmbulance = false) => {
          if (!db) return;
          const safeProfile = profile || {};
          try {
            const emergencyRef = push(ref(db, "emergencies"));

              patientId: safeProfile.uid || "Anonymous",

              reason:
                formData.healthConcern ||
                formData.symptoms ||
                "Urgent health concern",
              location: formData.location || "My GPS Location",
              urgency: formData.emergencyLevel,
              timestamp: new Date().toISOString(),
              status: "Pending Dispatch",
            });
            if (requestAmbulance) {
              const transferRef = push(ref(db, "transfers"));
              await set(transferRef, {
                emergencyId: emergencyRef.key,
                patientId: safeProfile.uid || "Anonymous",
                patientName: safeProfile.name || "Patient",
                status: "REQUESTED",
                requestedAt: new Date().toISOString(),
                patientLatitude: formData.latitude,
                patientLongitude: formData.longitude,
              });
            }
            showToast("Emergency reported to the response team.");
            setShowWizard(false);
          } catch (err) {
            showToast("Failed to report emergency.", "error");
          }
        };

        // Symptom to Specialization mapping rule
        const mapSymptomToSpecialization = (symptomStr) => {
          const text = (symptomStr || "").toLowerCase();
          if (
            text.includes("chest") ||
            text.includes("heart") ||
            text.includes("cardiac")
          )
            return "Cardiologist";
          if (
            text.includes("cough") ||
            text.includes("breath") ||
            text.includes("lung")
          )
            return "Pulmonologist";
          if (
            text.includes("diabetes") ||
            text.includes("sugar") ||
            text.includes("thyroid")
          )
            return "Endocrinologist";
          if (
            text.includes("kidney") ||
            text.includes("renal") ||
            text.includes("urine")
          )
            return "Nephrologist";
          if (
            text.includes("skin") ||
            text.includes("allergy") ||
            text.includes("rash")
          )
            return "Dermatologist";
          if (text.includes("eye") || text.includes("vision"))
            return "Ophthalmologist";
          if (
            text.includes("ear") ||
            text.includes("nose") ||
            text.includes("throat") ||
            text.includes("ent")
          )
            return "ENT Specialist";
          if (
            text.includes("pregnancy") ||
            text.includes("gyne") ||
            text.includes("delivery")
          )
            return "Gynecologist";
          if (
            text.includes("child") ||
            text.includes("pediatric") ||
            text.includes("baby")
          )
            return "Pediatrician";
          if (
            text.includes("bone") ||
            text.includes("fracture") ||
            text.includes("muscle") ||
            text.includes("joint")
          )
            return "Orthopedic Surgeon";
          if (
            text.includes("brain") ||
            text.includes("neuro") ||
            text.includes("paralysis") ||
            text.includes("headache")
          )
            return "Neurologist";
          if (
            text.includes("mental") ||
            text.includes("depression") ||
            text.includes("psych")
          )
            return "Psychiatrist";
          if (
            text.includes("cancer") ||
            text.includes("tumor") ||
            text.includes("onco")
          )
            return "Oncologist";
          if (
            text.includes("trauma") ||
            text.includes("accident") ||
            text.includes("emergency")
          )
            return "Emergency Medicine Specialist";
          return "General Physician";
        };

        // Local Fallback Recommendation Engine
        const runLocalFallbackRecommendation = () => {
          const selectedConcern = healthConcerns.find(
            (concern) => concern.label === formData.healthConcern,
          );
          const suggestedSpecialization =
            formData.selectedSpecialization ||
            selectedConcern?.departments?.[0];
          const specializationMatches = (doctor) => {
            const value = (doctor.specialization || "").toLowerCase();
            const target = (suggestedSpecialization || "").toLowerCase();
            return (
              value === target ||
              (target === "cardiology" && value === "cardiologist") ||
              (target === "orthopedics" && value.includes("orthopedic")) ||
              (target === "ent" && value.includes("ent")) ||
              (target === "gynecology" && value.includes("gynecologist")) ||
              (target === "general medicine" &&
                value.includes("general physician"))
            );
          };
          const matches = doctors.filter(
            (doctor) =>
              doctor.availability === "Available" &&
              specializationMatches(doctor),
          );

          // Calculate distances & wait times
          const computed = matches.map((d) => {
            const dist =
              Math.sqrt(
                Math.pow((d.latitude || 13.0827) - formData.latitude, 2) +
                  Math.pow((d.longitude || 80.2707) - formData.longitude, 2),
              ) * 111; // 1 deg ~ 111 km
            const waitTime =
              (d.currentPatients || 0) * (d.averageConsultationTime || 15);
            return {
              ...d,
              calculatedDistance: dist.toFixed(1),
              calculatedWaitingTime: waitTime,
            };
          });

          // Sort: Available first, then lower workload, then distance
          computed.sort((a, b) => {
            if (a.calculatedWaitingTime !== b.calculatedWaitingTime)
              return a.calculatedWaitingTime - b.calculatedWaitingTime;
            const aHasSlots =
              (a.todaySlots?.length || 0) + (a.tomorrowSlots?.length || 0);
            const bHasSlots =
              (b.todaySlots?.length || 0) + (b.tomorrowSlots?.length || 0);
            if (aHasSlots !== bHasSlots) return bHasSlots - aHasSlots;
            return a.calculatedDistance - b.calculatedDistance;
          });

          if (computed.length === 0) {
            return {
              unavailable: true,
              suggestedSpecialization,
              possibleDepartments: selectedConcern?.departments || [],
            };
          }

          const best = computed[0];
          const rec = {
            recommendedDoctorId: best.doctorId,
            recommendedDoctorName: best.name,
            reason: `Based on your selected reason for visit, ${best.specialization} may be an appropriate department. This is only an appointment navigation suggestion.`,
            appointmentNotes: [
              "This department suggestion does not replace emergency medical care.",
              "Bring your allergies and current medication details to the appointment.",
            ],
            suggestedSpecialization,
            selectedSpecialization: suggestedSpecialization,
            possibleDepartments: selectedConcern?.departments || [],
            nearestHospital: best.hospital,
            estimatedWaitingTime: `${best.calculatedWaitingTime} mins`,
            distance: `${best.calculatedDistance} km`,
            consultationFee: `\$${best.fee || 30}`,
            availableSlot: best.todaySlots ? best.todaySlots[0] : "10:00 AM",
            rating: best.rating || 5.0,
            alternativeDoctors: computed.slice(1, 4).map((d) => ({
              doctorId: d.doctorId,
              name: d.name,
              specialization: d.specialization,
              waitingTime: `${d.calculatedWaitingTime} mins`,
              distance: `${d.calculatedDistance} km`,
            })),

          return rec;
        };

        // Built-in appointment recommendation engine
        const getRecommendation = () => {
          setLoadingAi(true);
          setAiRecommendation(null);
          setRecDoctorsList([]);
          setTimeout(() => {
            setAiRecommendation(runLocalFallbackRecommendation());
            setRecDoctorsList(doctors);
            setLoadingAi(false);
            setWizardStep(2);

        const handleConfirmAppointment = async () => {
          if (!db || !aiRecommendation) return;
          const targetDocId =
            selectedDocId || aiRecommendation.recommendedDoctorId;
          const matchedDoc = recDoctorsList.find(

          const safeProfile = profile || {};
          if (matchedDoc.availability !== "Available") {

              "This doctor is no longer available. Please choose another available doctor.",
              "error",

            return;

            const apptRef = push(ref(db, "appointments"));

            await set(apptRef, {
              patientId: safeProfile.uid || "Anonymous",
              patientName: safeProfile.name || "Patient",
              doctorId: targetDocId,
              doctorName: matchedDoc.name,
              hospitalId: matchedDoc.hospitalId || "hosp_lifecare",

              appointmentTime: timeSlot,
              healthConcern: formData.healthConcern,

              condition: formData.condition,
              patientAge: formData.age,
              patientGender: formData.gender,
              duration: formData.duration,
              painLevel: formData.painLevel,
              medications: formData.currentMedications,
              allergies: formData.allergies,
              preferredHospital: formData.prefHospital,
              location: {
                latitude: formData.latitude,
                longitude: formData.longitude,

              specialization:
                matchedDoc.specialization ||
                mapSymptomToSpecialization(formData.symptoms),
              emergencyLevel: formData.emergencyLevel,
              status: "Booked",
              createdAt: new Date().toISOString(),
            });

            // Handle Critical Emergencies immediately
            if (formData.emergencyLevel === "Critical") {
              const emergencyRef = push(ref(db, "emergencies"));
              await set(emergencyRef, {
                patientId: safeProfile.uid || "Anonymous",
                patientName: safeProfile.name || "Patient",
                reason: `AI Smart Critical Dispatch: ${formData.symptoms}`,
                location: "My GPS Location",
                urgency: "Critical",
                notifiedSpecialists: doctors
                  .filter(
                    (doctor) =>
                      doctor.specialization === matchedDoc.specialization,
                  )
                  .slice(0, 5)
                  .map((doctor) => doctor.doctorId),
                timestamp: new Date().toISOString(),
                status: "Pending Dispatch",

              // Set emergency alert details
              setEmergencyAlert({
                emergencyId: emergencyRef.key,
                hospital: matchedDoc.hospital || "Lifecare General Hospital",
                doctor: matchedDoc.name,
                distance: aiRecommendation.distance || "1.5 km",
                latitude: formData.latitude,
                longitude: formData.longitude,

              setBookingConfirmation({
                doctorName: matchedDoc.name,
                department:
                  formData.selectedSpecialization ||
                  aiRecommendation.selectedSpecialization,
                date: selectedSlotDate,
                time: timeSlot,

              showToast(
                "Appointment booked successfully! Awaiting doctor confirmation.",

            setShowWizard(false);
            setWizardStep(1);
            setAiRecommendation(null);
            setSelectedDocId(null);
            setSelectedSlot("");
            setSelectedSlotDate("Today");

            showToast("Failed to book appointment.", "error");

        const bookEmergencyAmbulance = async () => {
          if (!db || !emergencyAlert) return;

              emergencyId: emergencyAlert.emergencyId,
              patientId: (profile && profile.uid) || "Anonymous",
              patientName: (profile && profile.name) || "Patient",
              hospital: emergencyAlert.hospital,
              status: "REQUESTED",
              requestedAt: new Date().toISOString(),
              patientLatitude: emergencyAlert.latitude,

            const docRef = ref(db, `doctors/${docId}`);

              await set(ref(db, `doctors/${docId}/rating`), newRating);

                      <span className="text-slate-800 font-extrabold font-mono leading-relaxed block whitespace-pre-wrap">
                        {viewPrescription.prescription ||
                          "Follow general rest precautions."}
                      </span>
                    </div>
                    {viewPrescription.followUpDate && (
                      <div className="bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100">
                        <span className="text-[10px] text-indigo-400 uppercase font-bold block mb-1">
                          Suggested Follow-Up Date
                        </span>
                        <span className="text-indigo-800 font-extrabold">
                          {viewPrescription.followUpDate}
                        </span>
                      </div>
                    )}
                  </div>
                  <button
                    onClick={() => {
                      showToast("Prescription downloaded as PDF.");
                      setViewPrescription(null);
                    }}
                    className="w-full py-3 bg-brand-500 text-white hover:bg-brand-600 font-extrabold rounded-xl transition shadow"
                  >
                    Download prescription PDF
                  </button>
                </div>
              </div>
            )}

            {/* --- VIRTUAL CONSULTATION MODAL --- */}
            {activeConsultation && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center p-4">
                <div className="bg-white w-full max-w-xl rounded-3xl shadow-2xl flex flex-col h-[70vh] border border-slate-100 overflow-hidden animate-slide-in relative">
                  <header className="p-4 border-b border-slate-100 bg-brand-500 text-white flex justify-between items-center">
                    <div>
                      <h4 className="text-md font-extrabold">
                        Virtual Consultation Room
                      </h4>
                      <span className="text-[10px] font-bold opacity-80">
                        Consultation with {activeConsultation.doctorName}
                      </span>
                    </div>
                    <button
                      onClick={() => setActiveConsultation(null)}
                      className="text-white hover:opacity-80 font-bold"
                    >
                      Leave Room
                    </button>
                  </header>

                  <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50">
                    {chatHistory.map((chat, idx) => (
                      <div
                        key={idx}
                        className={`flex ${chat.sender === "patient" ? "justify-end" : "justify-start"}`}
                      >
                        <div
                          className={`p-3 rounded-2xl text-xs font-semibold max-w-xs shadow-sm ${
                            chat.sender === "patient"
                              ? "bg-brand-500 text-white rounded-tr-none"
                              : "bg-white text-slate-800 rounded-tl-none border border-slate-100"
                          }`}
                        >
                          {chat.text}
                        </div>
                      </div>
                    ))}
                  </div>

                  <footer className="p-3 border-t border-slate-100 flex gap-2 bg-white">
                    <input
                      type="text"
                      value={chatMessage}
                      onChange={(e) => setChatMessage(e.target.value)}
                      placeholder="Type message to doctor..."
                      className="flex-1 px-4 py-2 border border-slate-200 rounded-xl outline-none focus:border-brand-500 text-xs font-semibold"
                      onKeyDown={(e) => {
                        if (e.key === "Enter") handleSendMessage();
                      }}
                    />
                    <button
                      onClick={handleSendMessage}
                      className="px-4 py-2 bg-brand-500 text-white font-extrabold rounded-xl text-xs shadow hover:bg-brand-600 transition"
                    >
                      Send
                    </button>
                  </footer>
                </div>
              </div>
            )}

            {/* --- RATING MODAL --- */}
            {ratingDoctor && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center p-4">
                <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4 animate-slide-in relative text-center">
                  <header className="flex justify-between items-center pb-2 border-b border-slate-100">
                    <h4 className="text-md font-extrabold text-slate-800">
                      Rate Doctor
                    </h4>
                    <button
                      onClick={() => setRatingDoctor(null)}
                      className="text-slate-400 font-bold"
                    >
                      X
                    </button>
                  </header>
                  <p className="text-xs text-slate-400 font-semibold">
                    How would you rate your consultation experience with Dr.{" "}
                    {ratingDoctor.doctorName}?
                  </p>

                  <div className="flex justify-center gap-2 py-4">
                    {[1, 2, 3, 4, 5].map((star) => (
                      <button
                        key={star}
                        onClick={() => setUserRating(star)}
                        className="text-3xl transition duration-100 hover:scale-110"
                      >
                        {star <= userRating ? "⭐" : "☆"}
                      </button>
                    ))}
                  </div>

                  <button
                    onClick={submitRating}
                    className="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-extrabold rounded-xl transition shadow"
                  >
                    Submit Rating
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      };

      // Render the React Application
      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
