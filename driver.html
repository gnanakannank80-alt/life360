<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifecare360 Ambulance Driver Portal</title>
  <link rel="icon" href="life.jpeg">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Leaflet.js Mapping Library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }
    .pulse-logo {
      animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes slide-in {
      from { transform: translateY(1rem); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-in {
      animation: slide-in 0.3s ease-out forwards;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fade-in 0.4s ease-out forwards;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#115e59',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full text-slate-800">
  <div id="root" class="h-full"></div>

  <!-- Main script block executing JSX and ES Modules -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      sendPasswordResetEmail, 
      onAuthStateChanged 
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { 
      getDatabase, 
      ref, 
      set, 
      get, 
      child, 
      push, 
      onValue, 
      serverTimestamp 
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    const { useState, useEffect, useRef } = React;

    // --- Embedded Custom SVG Icons (Lucide replacements) ---
    const Icon = ({ name, className = "w-6 h-6", ...props }) => {
      const icons = {
        activity: (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
        ),
        truck: (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <rect x="1" y="3" width="15" height="13" rx="2" ry="2" />
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
            <circle cx="5.5" cy="18.5" r="2.5" />
            <circle cx="18.5" cy="18.5" r="2.5" />
          </svg>
        ),
        eye: (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        ),
        eyeOff: (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" y1="2" x2="22" y2="22" />
          </svg>
        ),
        logout: (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        ),
        lock: (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        ),
        alert: (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        ),
        checkCircle: (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
        ),
        settings: (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        )
      };
      return icons[name] || icons['activity'];
    };

    const ROLE_KEY = 'driver';
    const ROLE_INFO = { label: "Ambulance Driver", icon: "truck", color: "from-amber-500 to-orange-600" };

    const App = () => {
      // Configuration & Firebase References
      const [firebaseConfig] = useState(() => {
        const saved = localStorage.getItem('lc_firebase_config');
        return saved ? JSON.parse(saved) : {
          apiKey: "AIzaSyAYN9lsXTxwoL9mqvPs2YbTnrYaIXAgOFE",
          authDomain: "lifecare360-968fd.firebaseapp.com",
          databaseURL: "https://lifecare360-968fd-default-rtdb.firebaseio.com",
          projectId: "lifecare360-968fd",
          storageBucket: "lifecare360-968fd.firebasestorage.app",
          messagingSenderId: "872526740925",
          appId: "1:872526740925:web:0feb7f631660778089e6d4"
        };
      });

      const [firebaseApp, setFirebaseApp] = useState(null);
      const [auth, setAuth] = useState(null);
      const [db, setDb] = useState(null);

      // Routing / UI States
      const [currentScreen, setCurrentScreen] = useState('loading');
      const [toasts, setToasts] = useState([]);
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [loading, setLoading] = useState(false);

      const showToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      // Initialize Firebase App
      useEffect(() => {
        if (firebaseConfig.apiKey) {
          try {
            const app = initializeApp(firebaseConfig);
            const authInstance = getAuth(app);
            const dbInstance = getDatabase(app);
            setFirebaseApp(app);
            setAuth(authInstance);
            setDb(dbInstance);
          } catch (err) {
            console.error("Firebase Init Error:", err);
            showToast("Failed to initialize Firebase. Verify settings.", "error");
          }
        }
      }, [firebaseConfig]);

      // Auth State Listener
      useEffect(() => {
        if (!auth || !db) return;
        const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
          if (currentUser) {
            setUser(currentUser);
            setLoading(true);
            try {
              const userRef = ref(db, `users/${currentUser.uid}`);
              const snapshot = await get(userRef);
              if (snapshot.exists()) {
                const data = snapshot.val();
                if (data.role.toLowerCase() !== ROLE_KEY) {
                  showToast("Mismatched Role: Access denied.", "error");
                  await signOut(auth);
                  setUser(null);
                  setProfile(null);
                  window.location.hash = "login";
                  setCurrentScreen('login');
                } else {
                  setProfile(data);
                  setCurrentScreen('dashboard');
                  window.location.hash = "dashboard";
                }
              } else {
                showToast("User profile not found in database.", "error");
                await signOut(auth);
                setUser(null);
                setProfile(null);
                window.location.hash = "login";
                setCurrentScreen('login');
              }
            } catch (err) {
              console.error(err);
              showToast("Error checking user profile.", "error");
              await signOut(auth);
            } finally {
              setLoading(false);
            }
          } else {
            setUser(null);
            setProfile(null);
            if (window.location.hash === '#dashboard' || window.location.hash === '') {
              window.location.hash = "login";
              setCurrentScreen('login');
            } else {
              handleHashRouting();
            }
          }
        });
        return () => unsubscribe();
      }, [auth, db]);

      const handleHashRouting = () => {
        const hash = window.location.hash.replace('#', '');
        if (hash === 'signup') {
          setCurrentScreen('signup');
        } else if (hash === 'forgot-password') {
          setCurrentScreen('forgot-password');
        } else if (hash === 'dashboard') {
          setCurrentScreen('dashboard');
        } else {
          setCurrentScreen('login');
        }
      };

      useEffect(() => {
        window.addEventListener('hashchange', handleHashRouting);
        return () => window.removeEventListener('hashchange', handleHashRouting);
      }, [auth]);

      const logLoginActivity = async (email, status, userId = "") => {
        if (!db) return;
        try {
          const logRef = push(ref(db, 'loginActivity'));
          await set(logRef, {
            userId: userId,
            role: ROLE_KEY,
            email: email,
            timestamp: serverTimestamp(),
            status: status
          });
        } catch (err) {
          console.error("Activity Logging Error:", err);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 relative overflow-hidden">
          
          {/* Header */}
          <header className="bg-white border-b border-slate-100 py-4 px-6 flex justify-between items-center z-10 shadow-sm">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.location.href = "index.html"}>
              <div className="bg-brand-500 text-white p-2 rounded-xl shadow-md shadow-brand-500/20">
                <Icon name="activity" className="w-6 h-6" />
              </div>
              <div>
                <h1 className="font-extrabold text-xl tracking-tight text-slate-900">LIFECARE<span className="text-brand-500">360</span></h1>
                <p className="text-[10px] text-slate-400 font-medium tracking-wide uppercase">Connected Care Network</p>
              </div>
            </div>
            
            <div className="flex items-center gap-4">
              {user && (
                <button
                  onClick={async () => {
                    setLoading(true);
                    try {
                      await signOut(auth);
                      showToast("Logged out successfully.");
                      window.location.hash = "login";
                    } catch (err) {
                      showToast("Logout failed.", "error");
                    } finally {
                      setLoading(false);
                    }
                  }}
                  className="px-4 py-2 text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-xl font-bold flex items-center gap-2 text-sm transition"
                >
                  <Icon name="logout" className="w-4 h-4" />
                  Logout
                </button>
              )}
            </div>
          </header>

          {/* Main Area */}
          <main className="flex-1 flex flex-col justify-center items-center p-4 md:p-8 relative">
            {loading && (
              <div className="absolute inset-0 bg-white/70 flex justify-center items-center z-50 transition duration-300">
                <div className="flex flex-col items-center gap-3">
                  <div className="animate-spin rounded-full h-12 w-12 border-4 border-brand-500 border-t-transparent shadow-md"></div>
                  <span className="text-sm font-bold text-slate-500">Loading Driver Portal...</span>
                </div>
              </div>
            )}

            {currentScreen === 'loading' && (
              <div className="flex flex-col items-center gap-3">
                <div className="animate-spin rounded-full h-12 w-12 border-4 border-brand-500 border-t-transparent shadow-md"></div>
                <span className="text-sm font-bold text-slate-500">Initializing...</span>
              </div>
            )}

            {currentScreen === 'login' && (
              <LoginScreen auth={auth} db={db} logLoginActivity={logLoginActivity} showToast={showToast} setLoading={setLoading} />
            )}

            {currentScreen === 'signup' && (
              <SignUpScreen auth={auth} db={db} showToast={showToast} setLoading={setLoading} />
            )}

            {currentScreen === 'forgot-password' && (
              <ForgotPasswordScreen auth={auth} showToast={showToast} setLoading={setLoading} />
            )}

            {currentScreen === 'dashboard' && (
              <DashboardContainer user={user} profile={profile} db={db} showToast={showToast} />
            )}
          </main>

          {/* Toast Container */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2">
            {toasts.map(t => (
              <div 
                key={t.id} 
                className={`flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl border text-sm font-semibold transition duration-300 animate-slide-in ${
                  t.type === 'success' 
                    ? 'bg-emerald-50 text-emerald-800 border-emerald-100' 
                    : 'bg-rose-50 text-rose-800 border-rose-100'
                }`}
              >
                <Icon name={t.type === 'success' ? 'checkCircle' : 'alert'} className={`w-5 h-5 ${t.type === 'success' ? 'text-emerald-500' : 'text-rose-500'}`} />
                <span>{t.message}</span>
              </div>
            ))}
          </div>

          {/* Footer */}
          <footer className="py-4 text-center text-xs font-semibold text-slate-400 bg-white border-t border-slate-100">
            &copy; {new Date().getFullYear()} Lifecare360 Network. Connected Care. Anytime. Anywhere.
          </footer>
        </div>
      );
    };

    // --- LOGIN SCREEN ---
    const LoginScreen = ({ auth, db, logLoginActivity, showToast, setLoading }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!auth) {
          showToast("Firebase must be configured first.", "error");
          return;
        }
        setLoading(true);
        try {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const loggedInUser = userCredential.user;

          const snapshot = await get(ref(db, `users/${loggedInUser.uid}`));
          if (snapshot.exists()) {
            const dbProfile = snapshot.val();
            const dbRole = dbProfile.role.toLowerCase();

            if (dbRole !== ROLE_KEY) {
              showToast(`Access Mismatch: This account is registered as a ${dbProfile.role}.`, "error");
              await logLoginActivity(email, `Failed (Role Mismatch: ${dbRole})`, loggedInUser.uid);
              await signOut(auth);
            } else {
              showToast("Login successful!");
              await logLoginActivity(email, "Success", loggedInUser.uid);
              window.location.hash = "dashboard";
            }
          } else {
            showToast("User profile node missing in database.", "error");
            await signOut(auth);
          }
        } catch (err) {
          console.error(err);
          let errorMsg = "Login failed: Incorrect email or password.";
          if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
            errorMsg = "Incorrect password or login details.";
          }
          showToast(errorMsg, "error");
          await logLoginActivity(email, "Failed");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="w-full max-w-md bg-white border border-slate-100 rounded-3xl p-8 shadow-xl relative overflow-hidden">
          <div className={`absolute top-0 inset-x-0 h-2 bg-gradient-to-r ${ROLE_INFO.color}`}></div>
          
          <div className="text-center mb-6">
            <div className={`w-14 h-14 rounded-2xl bg-gradient-to-tr ${ROLE_INFO.color} text-white flex items-center justify-center mx-auto mb-4 shadow-lg`}>
              <Icon name={ROLE_INFO.icon} className="w-7 h-7" />
            </div>
            <h2 className="text-2xl font-extrabold text-slate-800">{ROLE_INFO.label} Log In</h2>
            <p className="text-sm font-semibold text-slate-400 mt-1">LIFECARE360 Access Portal</p>
          </div>

          <form onSubmit={handleLogin} className="space-y-4">
            <div>
              <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
              <input 
                type="email" 
                required 
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium text-slate-800"
                placeholder="Enter registered email"
              />
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
              <div className="relative">
                <input 
                  type={showPassword ? "text" : "password"} 
                  required 
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium text-slate-800 pr-12"
                  placeholder="Enter password"
                />
                <button 
                  type="button"
                  onClick={() => setShowPassword(prev => !prev)}
                  className="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600"
                >
                  <Icon name={showPassword ? 'eyeOff' : 'eye'} className="w-5 h-5" />
                </button>
              </div>
            </div>

            <div className="flex items-center justify-between text-sm">
              <label className="flex items-center gap-2 text-slate-500 cursor-pointer font-semibold">
                <input 
                  type="checkbox" 
                  className="w-4 h-4 rounded text-brand-500 border-slate-300 focus:ring-brand-500" 
                />
                Remember Me
              </label>
              <a href="#forgot-password" className="text-brand-600 hover:text-brand-700 font-bold">Forgot Password?</a>
            </div>

            <button 
              type="submit" 
              className={`w-full py-3.5 rounded-xl font-extrabold text-white bg-gradient-to-r ${ROLE_INFO.color} shadow-lg transition duration-200`}
            >
              Sign In
            </button>
          </form>

          <div className="mt-6 pt-6 border-t border-slate-100 flex flex-col gap-3 text-center">
            <p className="text-sm font-semibold text-slate-500">
              New to the platform?{' '}
              <a href="#signup" className="text-brand-600 hover:text-brand-700 font-bold">Create Node Account</a>
            </p>
            <a href="index.html" className="text-sm font-bold text-slate-400 hover:text-slate-600">Back to Role Portal</a>
          </div>
        </div>
      );
    };

    // --- SIGN UP SCREEN ---
    const SignUpScreen = ({ auth, db, showToast, setLoading }) => {
      const [formData, setFormData] = useState({});
      const [errors, setErrors] = useState({});
      const [showPassword, setShowPassword] = useState(false);

      const handleFieldChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
        if (errors[field]) setErrors(prev => ({ ...prev, [field]: null }));
      };

      const handleSignUp = async (e) => {
        e.preventDefault();
        
        const newErrors = {};
        if (formData.password !== formData.confirmPassword) {
          newErrors.confirmPassword = "Passwords do not match.";
        }
        if (formData.password && formData.password.length < 6) {
          newErrors.password = "Password must be at least 6 characters.";
        }

        if (Object.keys(newErrors).length > 0) {
          setErrors(newErrors);
          return;
        }

        if (!auth) {
          showToast("Firebase must be configured first.", "error");
          return;
        }

        setLoading(true);
        try {
          const userCredential = await createUserWithEmailAndPassword(auth, formData.email, formData.password);
          const newUser = userCredential.user;

          const profileNode = {
            uid: newUser.uid,
            name: formData.fullName || "Lifecare Driver",
            email: formData.email,
            phone: formData.phone || "",
            role: ROLE_KEY,
            licenseNumber: formData.licenseNumber || "",
            ambulanceNumber: formData.ambulanceNumber || "",
            hospital: formData.hospital || "",
            location: formData.location || "",
            createdAt: new Date().toISOString()
          };

          await set(ref(db, `users/${newUser.uid}`), profileNode);
          showToast("Registration successful! Driver profile loaded.");
          window.location.hash = "dashboard";
        } catch (err) {
          console.error(err);
          let msg = "Signup failed. Review field values.";
          if (err.code === 'auth/email-already-in-use') {
            msg = "Email address is already registered.";
          }
          showToast(msg, "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="w-full max-w-2xl bg-white border border-slate-100 rounded-3xl p-8 shadow-xl relative overflow-hidden my-6">

              <div className="md:col-span-2 border-t border-slate-100 pt-5 mt-2 grid grid-cols-1 md:grid-cols-2 gap-5">
                <FormField label="Email Address" type="email" required onChange={(v) => handleFieldChange('email', v)} />
                <div className="h-1 flex md:hidden col-span-1"></div>
                
                <div>
                  <FormField

          <div className="mt-6 pt-6 border-t border-slate-100 flex flex-col gap-3 text-center">
            <p className="text-sm font-semibold text-slate-500">

            <a href="index.html" className="text-sm font-bold text-slate-400 hover:text-slate-600">Back to Role Portal</a>

    };

    // Helper Form Field Component
    const FormField = ({ label, type = "text", placeholder, required, onChange, className = "" }) => {
      const inputClass = "w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium text-slate-800";

    // Helper Select Component
    const FormSelect = ({ label, options, onChange, className = "" }) => {

    // --- FORGOT PASSWORD SCREEN ---
    const ForgotPasswordScreen = ({ auth, showToast, setLoading }) => {
      const [email, setEmail] = useState('');

      return (
        <div className="w-full max-w-md bg-white border border-slate-100 rounded-3xl p-8 shadow-xl relative overflow-hidden">

          <div className="text-center mb-6">
            <div className="w-14 h-14 rounded-2xl bg-brand-50 text-brand-500 flex items-center justify-center mx-auto mb-4">
              <Icon name="lock" className="w-7 h-7" />

            <h2 className="text-2xl font-extrabold text-slate-800">Password Reset</h2>

          {!sent ? (

              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
                <input 
                  type="email" 
                  required 
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-brand-500 font-medium"
                  placeholder="name@hospital.com"
                />

              <button

                Send Reset Link

          ) : (
            <div className="text-center py-4 space-y-4">
              <div className="bg-emerald-50 text-emerald-600 p-4 rounded-2xl border border-emerald-100">
                <p className="text-sm font-bold">Email Sent Successfully!</p>
                <p className="text-xs font-medium mt-1">Check your inbox ({email}) for further instructions.</p>

          <div className="mt-6 pt-6 border-t border-slate-100 text-center">

          </div>

    // --- DASHBOARDS ROUTER ---
    const DashboardContainer = ({ user, profile, db, showToast }) => {
      const roleProfile = profile || { name: "Driver", email: "", role: "driver" };

      return (
        <div className="w-full max-w-6xl mx-auto space-y-8 animate-fade-in py-4">
          
          {/* User Welcome Header Banner */}
          <div className="bg-white border border-slate-100 rounded-3xl p-6 md:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-sm relative overflow-hidden">
            <div className={`absolute left-0 inset-y-0 w-3 bg-gradient-to-b ${ROLE_INFO.color}`}></div>
            <div>
              <div className="flex items-center gap-2 mb-1.5">
                <span className="text-xs font-bold uppercase tracking-widest text-slate-400">Secure Node Dashboard</span>
                <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-brand-50 text-brand-600 border border-brand-100`}>
                  {ROLE_INFO.label}
                </span>
              </div>
              <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">
                Welcome back, {roleProfile.name}
              </h2>
              <p className="text-slate-500 text-sm font-medium mt-1">Node Reference ID: <span className="font-mono text-slate-600 bg-slate-50 px-2 py-0.5 rounded border border-slate-100">{user?.uid}</span></p>
            </div>
            
            <div className="bg-slate-50 border border-slate-100 p-4 rounded-2xl flex flex-col gap-1 text-xs font-semibold text-slate-500 max-w-xs w-full md:w-auto">
              <div>Email: <span className="text-slate-800 font-bold">{roleProfile.email}</span></div>
              {roleProfile.phone && <div>Phone: <span className="text-slate-800 font-bold">{roleProfile.phone}</span></div>}
              <div>Registered: <span className="text-slate-800 font-bold">{roleProfile.createdAt ? new Date(roleProfile.createdAt).toLocaleDateString() : "N/A"}</span></div>
            </div>
          </div>

          <AmbulanceDriverDashboard profile={roleProfile} db={db} showToast={showToast} user={user} />
        </div>
      );
    };

    // --- SUB-DASHBOARD: AMBULANCE DRIVER ---
    const AmbulanceDriverDashboard = ({ profile, db, showToast, user }) => {
      const [emergencies, setEmergencies] = useState([]);
      const [selectedEmergency, setSelectedEmergency] = useState(null);
      const [hospitals, setHospitals] = useState([]);
      const [recommendedHospital, setRecommendedHospital] = useState(null);
      const [selectedHospital, setSelectedHospital] = useState(null);
      const [currentLocation, setCurrentLocation] = useState(null);
      const [trackingActive, setTrackingActive] = useState(false);
      const [activeTrip, setActiveTrip] = useState(null);
      const [routePath, setRoutePath] = useState([]);
      const [distance, setDistance] = useState("N/A");
      const [eta, setEta] = useState("N/A");
      const [driverStatus, setDriverStatus] = useState("STANDBY"); // STANDBY, EN_ROUTE, ARRIVED
      
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const routeLayerRef = useRef(null);
      const ambulanceMarkerRef = useRef(null);
      const hospitalMarkersRef = useRef([]);
      const watchIdRef = useRef(null);

      // Haversine helper
      const getHaversineDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371e3; // meters
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      };

      // OSRM routing helper
      const calculateRoadRouting = async (startLat, startLng, destLat, destLng) => {
        try {
          const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${destLng},${destLat}?overview=full&geometries=geojson`);
          if (!res.ok) throw new Error("OSRM failed");
          const json = await res.json();
          if (json.routes && json.routes.length > 0) {
            const route = json.routes[0];
            const dist = (route.distance / 1000).toFixed(1) + " km";
            const dur = Math.round(route.duration / 60) + " mins";
            const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
            return { distance: dist, duration: dur, coords };
          }
        } catch (err) {
          console.warn("OSRM error, falling back to Haversine straight-line distance:", err);
        }
        
        // Haversine fallback
        const distMeters = getHaversineDistance(startLat, startLng, destLat, destLng);
        const distanceKm = (distMeters / 1000).toFixed(1) + " km";
        const durationMins = Math.round((distMeters / 1000) / 40 * 60) + " mins";
        const coords = [[startLat, startLng], [destLat, destLng]];
        return { distance: distanceKm, duration: durationMins, coords };
      };

      // Fetch active emergencies & hospitals
      useEffect(() => {
        if (!db) return;
        const emergenciesRef = ref(db, 'emergencies');
        const unsubscribeEmergencies = onValue(emergenciesRef, (snapshot) => {
          if (snapshot.exists()) {
            const list = Object.entries(snapshot.val()).map(([id, val]) => ({ id, ...val }))
              .filter(e => e.status !== "ARRIVED" && e.status !== "RESOLVED");
            setEmergencies(list);
          } else {
            setEmergencies([]);
          }
        });

        const hospitalsRef = ref(db, 'hospitals');
        const unsubscribeHospitals = onValue(hospitalsRef, (snapshot) => {
          if (snapshot.exists()) {
            setHospitals(Object.values(snapshot.val()));
          }
        });

        return () => {
          unsubscribeEmergencies();
          unsubscribeHospitals();
        };
      }, [db]);

      // Initialize Current Location
      useEffect(() => {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            setCurrentLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude });
          },
          () => {
            // Default fallback location (Chennai Center)
            setCurrentLocation({ lat: 13.0827, lng: 80.2707 });
            showToast("GPS location unavailable. Using fallback location.", "error");
          }
        );
      }, []);

      // Calculate Recommended Hospital
      useEffect(() => {
        if (!currentLocation || hospitals.length === 0 || !selectedEmergency) return;
        
        const rankHospitals = async () => {
          const scoredHospitals = await Promise.all(hospitals.map(async (h) => {
            if (h.status === 'CLOSED') return { ...h, score: 9999, distanceText: "CLOSED", durationText: "N/A" };
            
            const routeData = await calculateRoadRouting(currentLocation.lat, currentLocation.lng, h.latitude, h.longitude);
            const durationMins = parseInt(routeData.duration);
            
            let score = durationMins;
            if (!h.emergencyAvailable) score += 50;
            if (h.icuBeds === 0) score += 30;
            
            const emergencyType = selectedEmergency.reason.toLowerCase();
            const hasSpecialist = h.specialists && h.specialists.some(s => {
              if (emergencyType.includes('cardiac') || emergencyType.includes('heart')) return s.toLowerCase().includes('cardio');
              if (emergencyType.includes('accident') || emergencyType.includes('injury')) return s.toLowerCase().includes('trauma') || s.toLowerCase().includes('ortho');
              if (emergencyType.includes('child') || emergencyType.includes('baby')) return s.toLowerCase().includes('pediat');
              return false;
            });
            if (!hasSpecialist) score += 15;

            return { ...h, score, distanceText: routeData.distance, durationText: routeData.duration, routeCoords: routeData.coords };
          }));

          const sorted = scoredHospitals.sort((a, b) => a.score - b.score);
          const best = sorted[0];
          if (best && best.score < 9999) {
            setRecommendedHospital(best);
            setSelectedHospital(best);
            setRoutePath(best.routeCoords || []);
            setDistance(best.distanceText || "N/A");
            setEta(best.durationText || "N/A");
          }
        };

        rankHospitals();
      }, [currentLocation, hospitals, selectedEmergency]);

      const handleHospitalSelect = async (hosp) => {
        if (!currentLocation || hosp.status === 'CLOSED') return;
        setSelectedHospital(hosp);
        try {
          const routeData = await calculateRoadRouting(currentLocation.lat, currentLocation.lng, hosp.latitude, hosp.longitude);
          setRoutePath(routeData.coords);
          setDistance(routeData.distance);
          setEta(routeData.duration);
        } catch (err) {
          console.error(err);
        }
      };

      // Leaflet Map Rendering logic
      useEffect(() => {
        if (currentLocation && mapRef.current) {
          if (!mapInstance.current) {
            mapInstance.current = L.map(mapRef.current).setView([currentLocation.lat, currentLocation.lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap'
            }).addTo(mapInstance.current);
            setTimeout(() => {
              if (mapInstance.current) mapInstance.current.invalidateSize();
            }, 250);
          }

          if (ambulanceMarkerRef.current) {
            ambulanceMarkerRef.current.setLatLng([currentLocation.lat, currentLocation.lng]);
          } else {
            const ambIcon = L.divIcon({
              html: '<div class="text-3xl">🚑</div>',
              className: 'bg-transparent border-0',
              iconSize: [30, 30]
            });
            ambulanceMarkerRef.current = L.marker([currentLocation.lat, currentLocation.lng], { icon: ambIcon })
              .addTo(mapInstance.current)
              .bindPopup("Ambulance (You)")
              .openPopup();
          }

          hospitalMarkersRef.current.forEach(m => mapInstance.current.removeLayer(m));
          hospitalMarkersRef.current = [];

          hospitals.forEach(h => {
            const isRec = recommendedHospital && recommendedHospital.id === h.id;
            const isSel = selectedHospital && selectedHospital.id === h.id;
            const color = h.status === 'CLOSED' ? 'bg-red-500' : 'bg-brand-500';
            const border = isSel ? 'border-4 border-rose-500 scale-125' : isRec ? 'border-4 border-amber-400 scale-110' : 'border border-white';

            const hospIcon = L.divIcon({
              html: `<div class="relative w-8 h-8 rounded-full ${color} flex items-center justify-center text-white shadow-md font-bold text-xs ${border}">🏥</div>`,
              className: 'bg-transparent border-0',
              iconSize: [32, 32]
            });

            const marker = L.marker([h.latitude, h.longitude], { icon: hospIcon })
              .addTo(mapInstance.current)
              .bindPopup(`<b>${h.name}</b><br>ICU Beds: ${h.icuBeds}<br>Emergency: ${h.emergencyAvailable ? 'Yes' : 'No'}`);
            
            hospitalMarkersRef.current.push(marker);
          });

          if (routeLayerRef.current) {
            mapInstance.current.removeLayer(routeLayerRef.current);
            routeLayerRef.current = null;
          }
          if (routePath && routePath.length > 0) {
            routeLayerRef.current = L.polyline(routePath, { color: '#ef4444', weight: 6, opacity: 0.8 }).addTo(mapInstance.current);
            mapInstance.current.fitBounds(routeLayerRef.current.getBounds(), { padding: [40, 40] });
          }
        }
      }, [currentLocation, hospitals, routePath, recommendedHospital, selectedHospital]);

      const startLocationWatch = () => {
        if (!navigator.geolocation) return;
        watchIdRef.current = navigator.geolocation.watchPosition(
          async (pos) => {
            const newLat = pos.coords.latitude;
            const newLng = pos.coords.longitude;
            setCurrentLocation({ lat: newLat, lng: newLng });

            if (db && user) {
              await set(ref(db, `users/${user.uid}/location`), { lat: newLat, lng: newLng });
              if (activeTrip) {
                await set(ref(db, `transfers/${activeTrip.id}/ambulanceLatitude`), newLat);
                await set(ref(db, `transfers/${activeTrip.id}/ambulanceLongitude`), newLng);
                
                const route = await calculateRoadRouting(newLat, newLng, selectedHospital.latitude, selectedHospital.longitude);
                setRoutePath(route.coords);
                setDistance(route.distance);
                setEta(route.duration);

                await set(ref(db, `transfers/${activeTrip.id}/estimatedArrivalTime`), route.duration);
              }
            }
          },
          (err) => console.warn(err),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      };

      const stopLocationWatch = () => {
        if (watchIdRef.current) {
          navigator.geolocation.clearWatch(watchIdRef.current);
          watchIdRef.current = null;
        }
      };

      const startTrip = async () => {
        if (!selectedEmergency) {
          showToast("Select an active emergency assignment first.", "error");
          return;
        }
        if (!selectedHospital) {
          showToast("Select a destination hospital first.", "error");
          return;
        }
        setTrackingActive(true);
        setDriverStatus("EN_ROUTE");

        try {
          const transferRef = push(ref(db, 'transfers'));
          const tripData = {
            id: transferRef.key,
            ambulanceId: user.uid,
            patientId: selectedEmergency.id,
            patientName: selectedEmergency.patientName || "Anonymous",
            emergencyType: selectedEmergency.reason || "General Emergency",
            bloodGroup: selectedEmergency.bloodGroup || "Unknown",
            hospitalId: selectedHospital.id,
            ambulanceLatitude: currentLocation.lat,
            ambulanceLongitude: currentLocation.lng,
            destinationLatitude: selectedHospital.latitude,
            destinationLongitude: selectedHospital.longitude,
            estimatedArrivalTime: eta,
            status: "EN_ROUTE",
            createdAt: new Date().toISOString()
          };
          await set(transferRef, tripData);
          setActiveTrip(tripData);

          await set(ref(db, `emergencies/${selectedEmergency.id}/status`), "EN_ROUTE");

          startLocationWatch();
          showToast("Trip started! Navigating to " + selectedHospital.name);
        } catch (err) {
          showToast("Failed to initiate transfer.", "error");
          setTrackingActive(false);
          setDriverStatus("STANDBY");
        }
      };

      const manualLocationUpdate = async () => {
        if (!currentLocation || !selectedHospital) return;
        const step = 0.002;
        const dLat = selectedHospital.latitude - currentLocation.lat;
        const dLng = selectedHospital.longitude - currentLocation.lng;
        const dist = Math.sqrt(dLat*dLat + dLng*dLng);
        if (dist < 0.003) {
          showToast("You are extremely close to the hospital. Click Arrived.", "info");
          return;
        }
        const nextLat = currentLocation.lat + (dLat / dist) * step;
        const nextLng = currentLocation.lng + (dLng / dist) * step;
        
        setCurrentLocation({ lat: nextLat, lng: nextLng });
        showToast("Simulating ambulance movement...");

        if (db && user) {
          await set(ref(db, `users/${user.uid}/location`), { lat: nextLat, lng: nextLng });
          if (activeTrip) {
            await set(ref(db, `transfers/${activeTrip.id}/ambulanceLatitude`), nextLat);
            await set(ref(db, `transfers/${activeTrip.id}/ambulanceLongitude`), nextLng);
            
            const route = await calculateRoadRouting(nextLat, nextLng, selectedHospital.latitude, selectedHospital.longitude);
            setRoutePath(route.coords);
            setDistance(route.distance);
            setEta(route.duration);
            await set(ref(db, `transfers/${activeTrip.id}/estimatedArrivalTime`), route.duration);
          }
        }
      };

      const finishTrip = async () => {
        if (!activeTrip) return;
        stopLocationWatch();
        setTrackingActive(false);
        setDriverStatus("ARRIVED");

        try {
          await set(ref(db, `transfers/${activeTrip.id}/status`), "ARRIVED");
          await set(ref(db, `emergencies/${selectedEmergency.id}/status`), "ARRIVED");
          
          await set(ref(db, `tripHistory/${activeTrip.id}`), {
            ...activeTrip,
            status: "ARRIVED",
            completedAt: new Date().toISOString()
          });

          showToast("Arrived safely at " + selectedHospital.name + "!");
          setActiveTrip(null);
          setSelectedEmergency(null);
          setRecommendedHospital(null);
          setSelectedHospital(null);
          setRoutePath([]);
          setDistance("N/A");
          setEta("N/A");
          setDriverStatus("STANDBY");
        } catch (err) {
          showToast("Failed to complete trip record.", "error");
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div className="lg:col-span-1 space-y-6">
            
            <div className="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-lg font-extrabold text-slate-800">Ambulance Hub</h3>
                <span className={`px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 ${
                  driverStatus === 'EN_ROUTE' 
                    ? 'bg-amber-50 text-amber-700 border border-amber-100' 
                    : 'bg-emerald-50 text-emerald-700 border border-emerald-100'
                }`}>
                  <span className={`w-2.5 h-2.5 rounded-full ${driverStatus === 'EN_ROUTE' ? 'bg-amber-500' : 'bg-emerald-500 animate-pulse'}`}></span>
                  {driverStatus === 'EN_ROUTE' ? '🟠 EN ROUTE' : '🟢 ONLINE / STANDBY'}
                </span>
              </div>
              
              <div className="space-y-3.5 text-sm font-semibold text-slate-500">
                <div className="flex justify-between">
                  <span>License Plate:</span>
                  <span className="text-slate-800 font-extrabold">{profile.ambulanceNumber}</span>
                </div>
                <div className="flex justify-between">
                  <span>Sector Node:</span>
                  <span className="text-slate-800 font-extrabold">{profile.location}</span>
                </div>
                <div className="border-t border-slate-50 pt-3">
                  <span className="block text-xs text-slate-400 mb-1">Current Coordinates:</span>
                  <div className="font-mono text-xs text-slate-700 bg-slate-50 p-2 rounded-xl flex justify-between">
                    <span>Lat: {currentLocation?.lat.toFixed(5) || "N/A"}</span>
                    <span>Lng: {currentLocation?.lng.toFixed(5) || "N/A"}</span>
                  </div>
                </div>
              </div>
            </div>

            {!activeTrip && (
              <div className="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm">
                <h4 className="font-extrabold text-slate-800 mb-3">Emergency Allocations</h4>
                <p className="text-xs text-slate-400 font-semibold mb-4">Select an incoming emergency request to start navigation.</p>
                {emergencies.length > 0 ? (
                  <select 
                    value={selectedEmergency?.id || ""} 
                    onChange={(e) => {
                      const selected = emergencies.find(item => item.id === e.target.value);
                      setSelectedEmergency(selected);
                    }}
                    className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none bg-white text-sm font-bold text-slate-800"
                  >
                    <option value="">Choose emergency call</option>
                    {emergencies.map(e => (
                      <option key={e.id} value={e.id}>{e.patientName} ({e.reason})</option>
                    ))}
                  </select>
                ) : (
                  <div className="text-center py-4 bg-slate-50 rounded-2xl border text-xs font-bold text-slate-400">
                    No active emergency calls available.
                  </div>
                )}
              </div>
            )}

            {selectedEmergency && !activeTrip && recommendedHospital && (
              <div className="bg-white border border-rose-100 rounded-3xl p-6 shadow-sm bg-gradient-to-br from-rose-50/20 to-teal-50/10 border-l-4 border-l-rose-500">
                <span className="text-[10px] font-extrabold uppercase tracking-widest text-rose-600 block mb-1">Recommended Facility</span>
                <h4 className="text-base font-extrabold text-slate-800">{recommendedHospital.name}</h4>
                <p className="text-xs font-semibold text-slate-400 mt-0.5">{recommendedHospital.address}</p>
                <div className="mt-4 grid grid-cols-2 gap-3 text-xs text-slate-600 font-bold">
                  <div className="bg-white/60 p-2.5 rounded-xl border">ETA: <span className="text-rose-600 font-extrabold block mt-0.5">{recommendedHospital.durationText}</span></div>
                  <div className="bg-white/60 p-2.5 rounded-xl border">ICU Beds: <span className="text-emerald-600 font-extrabold block mt-0.5">{recommendedHospital.icuBeds} available</span></div>
                </div>
                <div className="text-[11px] font-semibold text-rose-800 bg-rose-50 p-2 rounded-xl mt-3 flex items-center gap-1.5">
                  <Icon name="checkCircle" className="w-4 h-4" />
                  Best hospital for {selectedEmergency.reason.toUpperCase()} emergency
                </div>
              </div>
            )}

            {selectedEmergency && !activeTrip && (
              <div className="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm">
                <h4 className="font-extrabold text-slate-800 mb-3">All Nearby Facilities</h4>
                <div className="space-y-2">
                  {hospitals.map(h => (
                    <button 
                      key={h.id}
                      onClick={() => handleHospitalSelect(h)}
                      disabled={h.status === 'CLOSED'}
                      className={`w-full text-left p-3 rounded-2xl border transition flex justify-between items-center ${
                        h.status === 'CLOSED'
                          ? 'opacity-40 bg-slate-50 cursor-not-allowed border-slate-100'
                          : selectedHospital?.id === h.id
                            ? 'bg-brand-50 border-brand-500 text-brand-900 font-extrabold'
                            : 'bg-white hover:bg-slate-50 border-slate-100'
                      }`}
                    >
                      <div>
                        <div className="text-xs font-extrabold">{h.name}</div>
                        <div className="text-[10px] text-slate-400 font-semibold mt-0.5">ICU Beds: {h.icuBeds} | Emergency: {h.emergencyAvailable ? 'Yes' : 'No'}</div>
                      </div>
                      <span className={`text-[10px] font-extrabold uppercase px-2 py-0.5 rounded ${
                        h.status === 'OPEN' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'
                      }`}>
                        {h.status}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {selectedEmergency && (
              <div className="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm space-y-3">
                <h4 className="font-extrabold text-slate-800 text-sm">Emergency Transfer Controls</h4>
                {activeTrip ? (
                  <div className="space-y-3">
                    <button 
                      onClick={manualLocationUpdate}
                      className="w-full py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-extrabold rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2"
                    >
                      <Icon name="activity" className="w-5 h-5" />
                      Simulate Location Update
                    </button>
                    <button 
                      onClick={finishTrip}
                      className="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-extrabold rounded-xl shadow-lg transition text-sm"
                    >
                      Arrived at Hospital
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={startTrip}
                    className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-extrabold rounded-xl shadow-lg transition text-sm"
                  >
                    Start Emergency Trip
                  </button>
                )}
              </div>
            )}
          </div>

          <div className="lg:col-span-2 space-y-6">
            <div className="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm overflow-hidden flex flex-col h-[500px] lg:h-[600px]">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-lg font-extrabold text-slate-800 flex items-center gap-2">
                  <Icon name="activity" className="w-5 h-5 text-rose-500" />
                  Live Navigation Routing
                </h3>
                {activeTrip && (
                  <div className="flex gap-4 text-xs font-bold text-slate-500">
                    <div>Remaining: <span className="text-slate-900 font-extrabold">{distance}</span></div>
                    <div>ETA: <span className="text-rose-600 font-extrabold">{eta}</span></div>
                  </div>
                )}
              </div>
              
              <div className="flex-1 w-full rounded-2xl bg-slate-50 relative border border-slate-100 z-0">
                <div ref={mapRef} className="absolute inset-0 rounded-2xl"></div>
              </div>

              {selectedHospital && (
                <div className="mt-4 pt-4 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <h4 className="font-extrabold text-slate-800 text-sm">{selectedHospital.name}</h4>
                    <p className="text-xs font-semibold text-slate-400">{selectedHospital.address}</p>
                  </div>
                  <div className="flex gap-3 w-full sm:w-auto">
                    <a 
                      href={`https://www.google.com/maps/dir/?api=1&origin=${currentLocation?.lat},${currentLocation?.lng}&destination=${selectedHospital.latitude},${selectedHospital.longitude}&travelmode=driving`}
                      target="_blank"
                      className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-xl shadow-md text-xs transition flex items-center gap-2"
                    >
                      <Icon name="settings" className="w-4 h-4" />
                      Start Navigation
                    </a>
                    <a 
                      href={`tel:${selectedHospital.phone}`}
                      className="px-4 py-2.5 border border-slate-200 hover:bg-slate-50 text-slate-600 font-bold rounded-xl text-xs transition"
                    >
                      Call Desk
                    </a>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Render the React Application
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
